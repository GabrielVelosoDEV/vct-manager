/* A conversa mora na ficha do jogador: é onde você já está olhando quando
   percebe que ele está mal. */
function blocoConversa(t,p){
  if(typeof opcoesDeConversa!=='function')return '';
  const mot=motivoDeInsatisfacao(t,p);
  const pode=podeConversar(p);
  const prom=p.promessa;
  const opts=opcoesDeConversa(t,p);
  return `<div class="card flat" style="margin-top:12px"><div class="split">
      <div class="eyebrow">Conversa</div>
      <span class="dim">${mot?esc(mot.texto):'Nada pendente com ele.'}</span>
    </div>
    ${prom?`<p class="dim" style="color:var(--amber);margin:6px 0">
      ⚠ Você prometeu titularidade — vence na semana ${prom.ate}. Promessa quebrada derruba
      ele e o vestiário junto.</p>`:''}
    ${pode?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      ${opts.map(o=>`<button class="btn ghost sm" data-conversa="${p.id}:${o.id}"
        title="${esc(o.dica)}">${esc(o.rot)}</button>`).join('')}</div>
      <p class="dim" style="margin-top:8px">O preparador mental do clube (nível
      ${((t.staff&&t.staff.mental)||1).toFixed(1)}) decide o quanto a conversa rende.
      Depois de falar, só dá para chamar de novo em ${CONVERSA_ESPERA} semanas.</p>`
     :`<p class="dim" style="margin-top:8px">Vocês conversaram há pouco. Dá para chamar de novo
       em ${semanasAteConversar(p)} semana(s).</p>`}
  </div>`;
}
function modalProposta(id){
  const p=P(id),t=meu();
  const taxa=p.timeId?pedidoDeVenda(p):0;
  const d=detalharPedido(p,t);
  const duras=recusasDuras(p,t,2);
  const R=REGIONS.find(r=>r.id===t.regiao);
  const casa=regiaoNatal(p);

  /* Mostrar a conta linha a linha é o ponto: sem isso o pedido salarial é um
     número que caiu do céu, e você não tem como saber se vale insistir, subir
     a oferta ou procurar outro jogador. */
  const conta=d.itens.length?`
    <div class="card flat" style="margin-top:12px"><div class="eyebrow">Por que ele pede isso</div>
      <table><tbody>
        <tr><td class="dim">Salário de mercado pelo over</td><td class="r num">${money(d.base)}</td></tr>
        ${d.itens.map(i=>`<tr><td>${esc(i.rot)}</td>
          <td class="r num ${i.fator>1?'dn':'up'}">${i.fator>1?'+':''}${Math.round((i.fator-1)*100)}%</td></tr>`).join('')}
        <tr><td><b>Pedido</b></td><td class="r num"><b>${money(d.pedido)}</b>/mês</td></tr>
      </tbody></table></div>`:'';

  const contexto=`<p class="dim">${
    p.timeId?'Sob contrato com <b>'+esc(nomeT(p.timeId))+'</b> por mais '+p.contrato+' ano(s).'
            :'Agente livre — sem taxa de transferência.'}
    Natural de ${esc(casa)}${casa!==t.regiao?', jogaria fora da região dele':''}.
    Entraria como <b>${d.pos<=5?d.pos+'º e titular':d.pos+'º do elenco, no banco'}</b>.</p>`;

  abrir(`<div class="eyebrow">Proposta</div><h2 class="sec">${esc(p.nome)}</h2>
  ${contexto}
  ${duras.length?`<div class="card flat" style="border-left:4px solid var(--red);margin-top:10px">
    <b>Não é questão de dinheiro:</b>${duras.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>`:''}
  <div class="grid g3" style="margin-top:12px">
    <div><label class="dim">Taxa de transferência</label><br>
      <input type="number" id="pTaxa" value="${taxa}" step="5000" ${p.timeId?'':'disabled'}></div>
    <div><label class="dim">Salário mensal</label><br>
      <input type="number" id="pSal" value="${d.pedido}" step="500"></div>
    <div><label class="dim">Anos de contrato</label><br>
      <input type="number" id="pAnos" value="2" min="1" max="4"></div>
  </div>
  ${conta}
  <div id="pFeed" style="margin-top:12px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn ghost" id="pJusto">Preencher com o que ele aceita</button>
    <button class="btn" id="pEnviar" ${duras.length?'disabled':''}>Enviar proposta</button>
    <button class="btn ghost" data-close>Cancelar</button></div>`);

  $('#pJusto').onclick=()=>{
    $('#pTaxa').value=taxa;$('#pSal').value=d.pedido;
  };
  $('#pEnviar').onclick=()=>{
    const taxa2=parseFloat($('#pTaxa').value)||0,sal2=parseFloat($('#pSal').value)||0,
          anos=parseInt($('#pAnos').value)||2;
    const m=avaliarProposta(p,t,taxa2,sal2,anos);
    if(m.length){$('#pFeed').innerHTML=`<div class="card flat" style="border-left:4px solid var(--red)">${
      m.map(x=>'<div>· '+esc(x)+'</div>').join('')}</div>`;return;}
    executarProposta(p,t,taxa2,sal2,anos);
    $('#pFeed').innerHTML=`<div class="card flat" style="border-left:4px solid var(--teal)"><b>Acordo fechado.</b> ${
      esc(p.nome)} é jogador do ${esc(t.nome)}.</div>`;
    $('#pEnviar').disabled=true;
  };
}
/* ---------- anunciar um jogador ----------
   Três decisões, e as três importam: se aceita venda, se aceita empréstimo, e
   se o empréstimo sai com opção de compra. Pedir muito acima do que ele vale
   é um jeito legítimo de dizer "só saio se pagarem". */
function modalAnunciar(id){
  const p=P(id),t=meu();
  if(!p||!t)return;
  const justo=pedidoDeVenda(p);
  const titular=t.titulares.includes(p.id);
  abrir(`<div class="eyebrow">Anunciar</div><h2 class="sec">${esc(p.nome)}</h2>
  <p class="dim">${p.idade} anos · ${esc(p.role)} · over ${over(p)} · potencial ${p.pot}
    · contrato de mais ${p.contrato} ano(s)${titular?' · <b>é titular hoje</b>':''}.
    O mercado avalia o passe dele em <b>${money(justo)}</b>.</p>
  ${p.pot-over(p)>=8&&p.idade<=21?`<div class="card flat" style="border-left:4px solid var(--teal);margin-top:10px">
    <b>Vale considerar o empréstimo.</b> Ele ainda tem ${p.pot-over(p)} pontos de evolução pela frente,
    e jogador que não entra em quadra não evolui.</div>`:''}
  <div class="grid g3" style="margin-top:12px">
    <div><label class="dim">Aceita</label><br>
      <select id="aModo">
        <option value="venda">Só venda</option>
        <option value="emprestimo">Só empréstimo</option>
        <option value="ambos" selected>Venda ou empréstimo</option>
      </select></div>
    <div><label class="dim">Pedido pelo passe</label><br>
      <input type="number" id="aPedido" value="${justo}" step="5000"></div>
    <div><label class="dim">Empréstimo</label><br>
      <select id="aOpcao">
        <option value="0">Sem opção de compra</option>
        <option value="1">Com opção de compra</option>
      </select></div>
  </div>
  <div id="aFeed" style="margin-top:12px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button class="btn" id="aOk">Anunciar</button>
    <button class="btn ghost" data-close>Cancelar</button></div>`);
  $('#aOk').onclick=()=>{
    const r=anunciarJogador(p,$('#aModo').value,$('#aOpcao').value==='1',
                            parseFloat($('#aPedido').value)||justo);
    if(!r.ok){$('#aFeed').innerHTML=`<div class="card flat" style="border-left:4px solid var(--red)">${esc(r.erro)}</div>`;return;}
    fechar();
  };
}

let aba=0;
function modalPartida(res){
  const eu=res.aId===G.meuTime?res.aId:res.bId, adv=res.aId===G.meuTime?res.bId:res.aId;
  const meuLadoA=res.aId===G.meuTime;
  const wEu=meuLadoA?res.wa:res.wb, wAd=meuLadoA?res.wb:res.wa;
  const venceu=res.vencedor===G.meuTime;
  const mp=res.mapas[Math.min(aba,res.mapas.length-1)];
  const hist=mp.hist.map((h,i)=>{
    const meuWin=meuLadoA?h.v:!h.v;
    const meuLado=meuLadoA?h.lado:(h.lado==='atk'?'def':'atk');
    return (i===12?'<span class="half"></span>':'')+`<i class="${meuWin?'w':'l'} ${meuLado}"></i>`;
  }).join('');
  const linhas=ids=>ids.map(id=>{const p=P(id),s=mp.st[id]||{k:0,d:0,a:0,fk:0,cl:0,rounds:0};
    return `<tr class="jrow ${p.timeId===G.meuTime?'me':''}" data-p="${p.id}"><td><b>${esc(p.nome)}</b> ${p.igl?'<span class="pill">IGL</span>':''}${id===res.mvp?' <span class="chip g">MVP</span>':''}</td>
    <td><span class="tag ${p.role}">${p.role}</span></td><td class="c num">${acsDe(s)}</td>
    <td class="c num">${s.k}</td><td class="c num">${s.d}</td><td class="c num">${s.a}</td>
    <td class="c num ${s.k-s.d>0?'up':s.k-s.d<0?'dn':''}">${s.k-s.d>0?'+':''}${s.k-s.d}</td>
    <td class="c num">${s.fk}</td><td class="c num">${s.cl}</td></tr>`;}).join('');
  abrir(`<div class="eyebrow">${esc(res.ctx.nome||'Partida')} · MD${res.bo}</div>
  <div class="scoreline">${escudo(T(eu),34)}<span class="${venceu?'win':'lose'}">${esc(nomeT(eu))}</span>
    <span class="s">${wEu} — ${wAd}</span><span>${esc(nomeT(adv))}</span>${escudo(T(adv),34)}</div>
  <div class="veto">${res.veto.map(s=>`<span class="${s.tipo==='ban'?'ban':s.tipo==='pick'?'pk':'dec'}">${s.tipo==='ban'?'ban':s.tipo==='pick'?'pick '+s.t:'decider'} · ${s.m}</span>`).join('')}</div>
  <div class="tabs">${res.mapas.map((m,i)=>{const e=meuLadoA?m.sa:m.sb,a=meuLadoA?m.sb:m.sa;
    return `<button data-ab="${i}" class="${i===Math.min(aba,res.mapas.length-1)?'on':''}">${m.mapa} ${e}-${a}</button>`;}).join('')}</div>
  <div class="card flat"><div class="eyebrow">Histórico de rounds · quadrado = ataque, círculo = defesa</div>
    <div class="rh">${hist}</div>
    <div class="split"><span class="dim">Placar final em ${mp.mapa}</span>
      <b class="num" style="font-size:18px">${meuLadoA?mp.sa:mp.sb} - ${meuLadoA?mp.sb:mp.sa}</b></div></div>
  <div class="card flat"><div class="eyebrow">${esc(nomeT(eu))}</div>
    <table><thead><tr><th>Jogador</th><th>Função</th><th class="c">ACS</th><th class="c">K</th><th class="c">D</th><th class="c">A</th>
    <th class="c">+/-</th><th class="c">FK</th><th class="c">CL</th></tr></thead><tbody>${linhas(T(eu).titulares)}</tbody></table></div>
  <div class="card flat"><div class="eyebrow">${esc(nomeT(adv))}</div>
    <table><thead><tr><th>Jogador</th><th>Função</th><th class="c">ACS</th><th class="c">K</th><th class="c">D</th><th class="c">A</th>
    <th class="c">+/-</th><th class="c">FK</th><th class="c">CL</th></tr></thead><tbody>${linhas(T(adv).titulares)}</tbody></table></div>
  <div style="display:flex;justify-content:flex-end"><button class="btn" data-close>Continuar</button></div>`,true);
  $('#modal').querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{aba=+b.dataset.ab;modalPartida(res);});
  $('#modal').querySelectorAll('.jrow').forEach(r=>r.onclick=()=>modalJogador(r.dataset.p));
}
function modalResumo(r){
  const dest=r.resultados.filter(x=>x.stage.tier===1).slice(0,14);
  abrir(`<div class="eyebrow">${esc(r.bloco)}</div><h2 class="sec">Rodada disputada</h2>
   ${dest.length?`<div class="card flat"><table><thead><tr><th>Competição</th><th>Confronto</th><th class="c">Placar</th></tr></thead>
   <tbody>${dest.map(x=>`<tr><td class="dim">${esc(x.stage.nome)}</td>
   <td>${timeInline(x.res.vencedor,18)} <span class="dim">venceu</span> ${timeInline(x.res.perdedor,18)}</td>
   <td class="c num">${Math.max(x.res.wa,x.res.wb)}-${Math.min(x.res.wa,x.res.wb)}</td></tr>`).join('')}</tbody></table></div>`
   :'<div class="empty">Sem partidas nesta rodada.</div>'}
   <div style="display:flex;justify-content:flex-end"><button class="btn" data-close>Continuar</button></div>`);
}

/* ============================================================
   FICHA EDITÁVEL — usada pelo Editor
   ------------------------------------------------------------
   Edita tudo que o modelo de dados guarda de um jogador: os oito
   atributos, potencial, contrato, condição, agentes, clube e foto.
   O over é derivado dos atributos (ver docs/DADOS.md), então aqui
   ele aparece como leitura ao vivo — e há um campo separado que
   reescala os atributos para um over alvo, que é o atalho de quem
   está montando base a partir de uma lista de overs.
   ============================================================ */
function modalEditarJogador(id){
  const p=P(id);if(!p)return;
  const chaveFoto=Imgs.chaveJog(p.nome);
  const temFoto=Imgs.tem(chaveFoto);
  const t=p.timeId?T(p.timeId):null;
  const linhaAt=k=>{
    const nome=ATTRS.find(a=>a[0]===k)[1];
    return `<div class="atrow">
      <span class="lb">${nome}</span>
      <input type="range" min="25" max="99" value="${Math.round(p.at[k])}" data-atr="${k}">
      <input type="number" min="25" max="99" value="${Math.round(p.at[k])}" data-atn="${k}" class="num">
    </div>`;};

  abrir(`<div class="split">
    <div class="linha-t" style="align-items:flex-start;gap:14px">${retrato(p,64)}<div>
      <div class="eyebrow">${t?esc(t.nome):'Sem clube'}</div>
      <h2 class="sec">Editar ${esc(p.nome)}</h2>
      <span class="dim">id ${esc(p.id)}</span></div></div>
    <div style="text-align:right">
      <div class="ov ${ovClass(over(p))}" id="edjOver" style="font-size:44px">${over(p)}</div>
      <div class="dim">over ao vivo</div></div>
  </div>

  <div class="grid g2" style="margin-top:12px">
    <div class="card flat"><div class="eyebrow">Ficha</div>
      <div class="campos">
        <label>Nick<input type="text" id="edjNome" value="${esc(p.nome)}"></label>
        <label>Função<select id="edjRole">${ROLES.map(r=>
          `<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select></label>
        <label>Secundária<select id="edjRole2">
          <option value="" ${!p.role2?'selected':''}>— nenhuma —</option>
          <option value="auto">↻ a melhor possível</option>
          ${p.role2&&custoDeFuncao(p,p.role2)>CUSTO_MAX_SECUNDARIA?
            `<option value="${p.role2}" selected>${p.role2} · não vale mais (−${
              custoDeFuncao(p,p.role2)})</option>`:''}
          ${ROLES.filter(r=>r!==p.role).map(r=>{
            const custo=custoDeFuncao(p,r), pode=custo<=CUSTO_MAX_SECUNDARIA;
            /* uma opção desabilitada nunca vem marcada: o navegador ignoraria a
               marcação e o campo apareceria vazio, como se o jogador não tivesse
               secundária nenhuma */
            const atual=p.role2===r&&pode;
            return `<option value="${r}" ${atual?'selected':''} ${pode?'':'disabled'}>${r}${
              pode?(custo>0?' (−'+custo+')':' (+'+(-custo)+')'):' · perfil não permite'}</option>`;
          }).join('')}</select></label>
        <label>Idade<input type="number" id="edjIdade" value="${p.idade}" min="15" max="40"></label>
        <label>País${selectPais('id="edjPais"',p.pais)}</label>
        <label>Gênero<select id="edjGenero">
          <option value="m" ${p.genero!=='f'?'selected':''}>Masculino</option>
          <option value="f" ${p.genero==='f'?'selected':''}>Feminino</option></select></label>
        <label>Potencial<input type="number" id="edjPot" value="${p.pot}" min="30" max="99"></label>
        <label>Contrato (anos)<input type="number" id="edjContrato" value="${p.contrato}" min="0" max="6"></label>
        <label>Salário / mês<input type="number" id="edjSalario" value="${Math.round(p.salario)}" step="100"></label>
        <label>Clube${edSelectTimes('id="edjTime"',p.timeId,true)}</label>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <input type="checkbox" id="edjIgl" ${p.igl?'checked':''} ${t?'':'disabled'}>
        <span>É o IGL do time</span></label>
      <div class="eyebrow" style="margin-top:14px">Reescalar para um over alvo</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <input type="number" id="edjAlvo" placeholder="${over(p)}" min="30" max="99" style="width:90px">
        <button class="btn ghost sm" id="edjAplicarAlvo">Aplicar</button>
        <span class="dim">mantém o perfil da função</span>
      </div>
    </div>

    <div class="card flat"><div class="eyebrow">Atributos · 25 a 99</div>
      ${ATTRS.map(a=>linhaAt(a[0])).join('')}
      <p class="dim" style="margin-top:6px">O over é a média destes atributos ponderada pelos pesos
      da função, então mudar de função muda o over sem mudar atributo nenhum.</p>
    </div>
  </div>

  <div class="grid g2">
    <div class="card flat"><div class="eyebrow">Condição</div>
      <div class="campos">
        <label>Moral (0–100)<input type="number" id="edjMoral" value="${Math.round(p.moral*100)}" min="0" max="100"></label>
        <label>Forma (0–100)<input type="number" id="edjForma" value="${Math.round(p.forma*100)}" min="0" max="100"></label>
        <label>Fadiga (0–100)<input type="number" id="edjFadiga" value="${Math.round(p.fadiga*100)}" min="0" max="100"></label>
        <label>Lesão (semanas)<input type="number" id="edjLesao" value="${p.lesao||0}" min="0" max="52"></label>
      </div>
      <label style="display:block;margin-top:10px">Agentes (separados por vírgula)
        <input type="text" id="edjAgentes" value="${esc(p.agentes.join(', '))}"></label>
      <p class="dim" style="margin-top:6px">Sugestões da função: ${esc(AGENTS[p.role].join(', '))}</p>
    </div>

    <div class="card flat"><div class="eyebrow">Foto</div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <img src="${ASSETS.foto(p)}" width="72" height="72" alt=""
          style="border:1px solid var(--line);background:var(--paper2)"
          onerror="this.onerror=null;this.src='${monogramaJogador(p.nome,72)}'">
        <div style="flex:1">
          <div class="dropzone sm" id="edjDrop">Arraste um PNG aqui ou
            <label class="lk">escolha o arquivo<input type="file" id="edjFile" accept="image/*" style="display:none"></label>
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap">
            <span class="chip ${temFoto?'t':'g'}">${temFoto?'no pacote':'sem imagem'}</span>
            ${temFoto?`<button class="btn ghost sm" id="edjFotoDel">Remover do pacote</button>`:''}
          </div>
          <label style="margin-top:8px;display:block">Caminho manual (opcional)
            <input type="text" id="edjFoto" value="${esc(p.foto||'')}" placeholder="${esc(ASSETS.dirFotos+ASSETS.slug(p.nome)+'.'+ASSETS.ext)}"></label>
        </div>
      </div>
      <p class="dim" style="margin-top:8px">Renomear o nick re-chaveia a imagem no pacote sozinho.</p>
    </div>
  </div>

  <div id="edjFeed"></div>
  <div style="display:flex;gap:8px;justify-content:space-between;margin-top:10px">
    <button class="btn ghost" id="edjApagar" style="border-color:var(--red);color:var(--red-d)">Apagar da base</button>
    <div style="display:flex;gap:8px">
      <button class="btn" id="edjSalvar">Salvar</button>
      <button class="btn ghost" data-close>Cancelar</button>
    </div></div>`,true);

  const M=$('#modal');
  const num=s=>{const el=M.querySelector(s);return el?parseFloat(el.value):null;};
  /* over ao vivo: recalcula pelos mesmos pesos do motor, sem tocar no jogador */
  const repintarOver=()=>{
    const role=M.querySelector('#edjRole').value;
    const w=ROLE_W[role];let tot=0;
    for(const k in w){
      const el=M.querySelector('[data-atn="'+k+'"]');
      tot+=(el?parseFloat(el.value)||0:p.at[k])*w[k];
    }
    const o=Math.round(tot);
    const alvo=$('#edjOver');
    alvo.textContent=o;
    alvo.className='ov '+ovClass(o);
  };
  ATTRS.forEach(([k])=>{
    const r=M.querySelector('[data-atr="'+k+'"]'),n=M.querySelector('[data-atn="'+k+'"]');
    r.addEventListener('input',()=>{n.value=r.value;repintarOver();});
    n.addEventListener('input',()=>{r.value=n.value;repintarOver();});
  });
  M.querySelector('#edjRole').addEventListener('change',repintarOver);

  M.querySelector('#edjAplicarAlvo').onclick=()=>{
    const alvo=num('#edjAlvo');
    if(!alvo)return;
    /* usa o próprio aplicarOver do motor num clone dos atributos */
    const clone={role:M.querySelector('#edjRole').value,at:{},pot:p.pot,idade:p.idade,forma:p.forma};
    for(const[k]of ATTRS)clone.at[k]=parseFloat(M.querySelector('[data-atn="'+k+'"]').value)||p.at[k];
    aplicarOver(clone,clamp(Math.round(alvo),30,99));
    for(const[k]of ATTRS){
      M.querySelector('[data-atn="'+k+'"]').value=Math.round(clone.at[k]);
      M.querySelector('[data-atr="'+k+'"]').value=Math.round(clone.at[k]);
    }
    repintarOver();
  };

  const subirFoto=async file=>{
    try{
      const uri=await Imgs.doArquivo(file);
      await Imgs.gravar(Imgs.chaveJog(M.querySelector('#edjNome').value.trim()||p.nome),uri);
      $('#edjFeed').innerHTML='<div class="card flat" style="border-left:4px solid var(--teal)">Foto no pacote.</div>';
      modalEditarJogador(id);
    }catch(e){
      $('#edjFeed').innerHTML='<div class="card flat" style="border-left:4px solid var(--red)">'+esc(e.message||'Falha ao subir.')+'</div>';
    }
  };
  ligarDropzone(M.querySelector('#edjDrop'),M.querySelector('#edjFile'),f=>subirFoto(f));
  const bDel=M.querySelector('#edjFotoDel');
  if(bDel)bDel.onclick=async()=>{await Imgs.apagar(chaveFoto);modalEditarJogador(id);};

  M.querySelector('#edjApagar').onclick=()=>{
    if(!confirm('Apagar '+p.nome+' da base? Não dá para desfazer.'))return;
    const r=edApagar(id);
    fechar();flash(r.ok?r.msg:r.erro);
  };

  M.querySelector('#edjSalvar').onclick=async()=>{
    const nomeAntes=p.nome;
    const at={};
    for(const[k]of ATTRS)at[k]=parseFloat(M.querySelector('[data-atn="'+k+'"]').value);
    const r=edAplicarJogador(id,{
      nome:M.querySelector('#edjNome').value,
      role:M.querySelector('#edjRole').value,
      role2:M.querySelector('#edjRole2').value,
      idade:num('#edjIdade'), pais:M.querySelector('#edjPais').value,
      genero:M.querySelector('#edjGenero').value,
      at, pot:num('#edjPot'), contrato:num('#edjContrato'), salario:num('#edjSalario'),
      moral:num('#edjMoral')/100, forma:num('#edjForma')/100, fadiga:num('#edjFadiga')/100,
      lesao:num('#edjLesao'),
      agentes:M.querySelector('#edjAgentes').value.split(',').map(x=>x.trim()).filter(Boolean),
      foto:M.querySelector('#edjFoto').value,
      igl:M.querySelector('#edjIgl').checked
    });
    if(!r.ok){$('#edjFeed').innerHTML='<div class="card flat" style="border-left:4px solid var(--red)">'+esc(r.erro)+'</div>';return;}
    if(r.renomeado)await Imgs.renomear(Imgs.chaveJog(r.renomeado.de),Imgs.chaveJog(r.renomeado.para));
    const destino=M.querySelector('#edjTime').value||null;
    if(destino!==(p.timeId||null)){
      const mv=edMover(id,destino);
      if(!mv.ok){$('#edjFeed').innerHTML='<div class="card flat" style="border-left:4px solid var(--red)">'+esc(mv.erro)+'</div>';return;}
    }
    fechar();flash(nomeAntes===p.nome?'Ficha salva.':'Ficha salva — '+nomeAntes+' virou '+p.nome+'.');
  };
}

  const bd=M.querySelector('#edsFotoDel');

  M.querySelector('#edsApagar').onclick=()=>{

/* ============================================================
   ANTES DA PARTIDA — relatório e veto
   ------------------------------------------------------------
   O ritual: você lê o que a sua comissão conseguiu levantar
   sobre o adversário e, com isso na mão, faz os seus bans e
   picks. O relatório vem de scout.js e o veto de veto.js; aqui
   é só a tela.

   A ordem importa. Primeiro o relatório, depois o veto: o
   objetivo é que o analista que você contratou mude o clique
   que você dá. Um clube com analista 1 chuta; um com analista 5
   sabe que mapa o adversário vai banir primeiro.
   ============================================================ */

let PP=null;   /* {comp, V, etapa:'relatorio'|'veto'} */

function prePartidaDisponivel(){
  if(!G||!G.meuTime)return null;
  if(typeof compromissoDaSemana!=='function')return null;
  return compromissoDaSemana();
}
/* Ponto de entrada: chamado pelo botão de avançar antes de a semana rodar. */
function abrirPrePartida(comp,depois){
  const meu=G.times[G.meuTime], adv=G.times[comp.advId];
  PP={comp,adv,meu,depois,etapa:'relatorio',
      V:iniciarVeto(G.meuTime,comp.advId,comp.bo,comp.euSouA)};
  vetoAvancarAteMim(PP.V);
  ppPintar();
}
function ppFechar(){
  const d=PP&&PP.depois;PP=null;
  const m=$('#modal');if(m)m.innerHTML='';
  if(d)d();
}
/* Segue sem escolher nada: o veto vira automático e a semana roda. */
function ppPular(){
  if(!PP)return;
  const V=PP.V;
  let voltas=0;
  while(!V.fim&&voltas++<40)vetoEscolher(V,null);
  ppConfirmar();
}
function ppConfirmar(){
  if(!PP)return;
  const V=PP.V;
  let voltas=0;
  while(!V.fim&&voltas++<40)vetoEscolher(V,null);
  const comp=PP.comp;
  const plano={stageId:comp.stage.id,veto:vetoResultado(V)};
  const d=PP.depois;PP=null;
  const m=$('#modal');if(m)m.innerHTML='';
  /* Com tempo técnico e transmissão ao vivo ligados, a SUA série é jogada
     agora, na tela, round a round — é o que faz o pedido de tempo mudar o que
     vem depois. O resultado pronto desce para o relógio, que roda o resto da
     semana em cima dele. */
  if(Prefs.get('tempoTecnico')&&Prefs.get('aoVivo')&&typeof partidaConduzida==='function'){
    const ctx={stage:comp.stage.id,nome:comp.stage.nome,semana:G.semana};
    const S=abrirSerie(comp.aId,comp.bId,comp.bo,plano.veto);
    partidaConduzida(S,ctx,res=>{
      res.semana=G.semana;
      plano.serieFeita=res;
      if(d)d(plano);
    });
    return;
  }
  if(d)d(plano);
}
function ppEscolher(mapa){
  if(!PP||!PP.V)return;
  if(!vetoMinhaVez(PP.V))return;
  vetoEscolher(PP.V,mapa);
  vetoAvancarAteMim(PP.V);
  ppPintar();
}
function ppIrParaVeto(){if(PP){PP.etapa='veto';ppPintar();}}

/* ---------- desenho ---------- */
function ppPintar(){
  if(!PP)return;
  abrir(PP.etapa==='relatorio'?ppRelatorioHTML():ppVetoHTML(),true);
  const M=$('#modal');
  M.querySelectorAll('[data-ppmapa]').forEach(b=>b.onclick=()=>ppEscolher(b.dataset.ppmapa));
  const li=M.querySelector('#ppVeto');if(li)li.onclick=ppIrParaVeto;
  const lp=M.querySelector('#ppPular');if(lp)lp.onclick=ppPular;
  const lc=M.querySelector('#ppOk');if(lc)lc.onclick=ppConfirmar;
  const lv=M.querySelector('#ppVoltar');if(lv)lv.onclick=()=>{PP.etapa='relatorio';ppPintar();};
}

/* ===== src/ui/aovivo.js ===== */
/* ============================================================
   PARTIDA AO VIVO
   ------------------------------------------------------------
   A simulação sempre foi round a round; o que faltava era
   revelar em sequência em vez de entregar o placar pronto.

   Duas decisões dão o tom:

   1. RITMO VARIÁVEL. Round comum passa rápido, pistol e match
      point seguram. Um relógio constante vira barra de progresso;
      o que prende é a tela desacelerar quando o jogo aperta.

   2. A PARTIDA JÁ ACONTECEU. Nada aqui muda resultado — é uma
      leitura do que o motor decidiu. Por isso pular é seguro e
      está sempre à mão: ninguém é obrigado a assistir.
   ============================================================ */

let AV=null;   /* estado da transmissão em andamento */

const AV_VEL=[['0.5','lento',1.8],['1','normal',1],['2','rápido',0.5],['4','turbo',0.25]];
const AV_MS_BASE=1150;   /* round de peso zero, na velocidade normal */
const AV_MS_PICO=2600;   /* round de peso 1 */

function avFechar(){
  if(AV&&AV.timer)clearTimeout(AV.timer);
  AV=null;
  const m=$('#modal');if(m)m.innerHTML='';
}

/* Ponto de entrada: chamado no lugar de modalPartida quando a preferência
   estiver ligada e a partida for sua. */
function partidaAoVivo(res){
  if(!res||!res.mapas||!res.mapas.length)return modalPartida(res);
  const souA=res.aId===G.meuTime;
  const meu=G.times[souA?res.aId:res.bId], adv=G.times[souA?res.bId:res.aId];
  AV={
    res,souA,meu,adv,
    mapaIdx:0,roundIdx:0,
    vel:parseFloat(Prefs.get('velocidadeAoVivo')||'1'),
    pausado:false,timer:null,
    linhas:[],       /* narração revelada até agora, do mapa corrente */
    mapasFeitos:[]   /* {mapa, meu, dele, fecho} */
  };
  avPintar();
  avAgendar(600);
}

/* ============================================================
   TRANSMISSÃO CONDUZIDA
   ------------------------------------------------------------
   A outra metade do "A PARTIDA JÁ ACONTECEU" lá de cima. Ela
   continua verdadeira quando a partida foi resolvida pelo
   relógio — e é falsa aqui: neste modo a série é jogada round a
   round ENQUANTO você assiste, porque pedido de tempo dentro de
   um placar já calculado é teatro.

   O que muda é só quem gira a manivela. O motor é o mesmo:
   abrirSerie/passoRound/fecharSerie, exatamente as funções que
   simPartida() usa. Por isso o resultado continua sendo do
   motor, e não da tela.
   ============================================================ */
function partidaConduzida(S,ctx,aoFim){
  const souA=S.aId===G.meuTime;
  const meu=G.times[souA?S.aId:S.bId], adv=G.times[souA?S.bId:S.aId];
  AV={
    S,ctx,aoFim,conduzida:true,
    res:{aId:S.aId,bId:S.bId,bo:S.bo,mapas:[],vencedor:null},
    souA,meu,adv,
    mapaIdx:0,roundIdx:0,
    vel:parseFloat(Prefs.get('velocidadeAoVivo')||'1'),
    pausado:false,timer:null,
    linhas:[],mapasFeitos:[],
    streak:0,ultimo:null,
    aviso:null      /* recado do pedido de tempo, para a narração dizer */
  };
  serieAbrirMapa(S);
  avPintar();
  avAgendar(700);
}
/* Termina a série sem animar e devolve o resultado a quem pediu. */
function avEncerrarConduzida(){
  const S=AV.S;
  while(!S.fim){
    if(!S.M&&!serieAbrirMapa(S))break;
    while(!S.M.fim)passoRound(S.M);
    const r=serieFecharMapa(S);
    if(r&&!AV.mapasFeitos.some(x=>x.mapa===r.mapa)){
      const m=AV.souA?r.sa:r.sb, d=AV.souA?r.sb:r.sa;
      AV.mapasFeitos.push({mapa:r.mapa,meu:m,dele:d,
        fecho:narrarFimDeMapa(r,AV.souA,AV.meu.tag,AV.adv.tag)});
    }
  }
  const res=fecharSerie(S,AV.ctx);
  AV.res=res;AV.fim=true;
  return res;
}
/* Um round da série conduzida. */
function avPassoConduzido(){
  const S=AV.S;
  if(!S.M){
    if(!serieAbrirMapa(S)){
      const res=avEncerrarConduzida();
      if(AV.aoFim)AV.aoFim(res);
      avPintar(true);return;
    }
    AV.linhas=[];AV.roundIdx=0;AV.streak=0;AV.ultimo=null;
    avPintar();avAgendar(1200/AV.vel);return;
  }
  const h=passoRound(S.M);
  if(!h){                     /* mapa acabou */
    const r=serieFecharMapa(S);
    if(r){
      const m=AV.souA?r.sa:r.sb, d=AV.souA?r.sb:r.sa;
      AV.mapasFeitos.push({mapa:r.mapa,meu:m,dele:d,
        fecho:narrarFimDeMapa(r,AV.souA,AV.meu.tag,AV.adv.tag)});
      AV.mapaIdx++;
    }
    if(S.fim){
      const res=fecharSerie(S,AV.ctx);
      AV.res=res;AV.fim=true;
      if(AV.aoFim)AV.aoFim(res);
      avPintar(true);return;
    }
    AV.linhas=[];AV.roundIdx=0;
    avPintar();avAgendar(1600/AV.vel);return;
  }
  const vencedorMeu=AV.souA?h.v:!h.v;
  if(AV.ultimo===vencedorMeu)AV.streak++;else AV.streak=1;
  AV.ultimo=vencedorMeu;
  const l=narrarRound(h,{souA:AV.souA,meuTag:AV.meu.tag,advTag:AV.adv.tag,
                         streak:AV.streak,ultimo:false});
  if(AV.aviso){l.texto=AV.aviso+' '+l.texto;AV.aviso=null;}
  AV.linhas.unshift(l);
  AV.roundIdx++;
  if(S.M.fim){                /* o round que acabou de sair fechou o mapa */
    avPintar();
    avAgendar(900/AV.vel);
    return;
  }
  avPintar();
  avAgendar((AV_MS_BASE+(AV_MS_PICO-AV_MS_BASE)*l.peso)*AV.vel);
}
/* O pedido de tempo. Só existe no modo conduzido — no modo que apenas revela
   uma partida já resolvida ele não teria como mudar nada, e um botão que não
   muda nada é pior do que botão nenhum. */
function avPedirTempo(){
  if(!AV||!AV.conduzida||!AV.S||!AV.S.M)return;
  const ehA=AV.souA;
  const r=pedirTempo(AV.S.M,ehA);
  if(!r)return;
  AV.aviso='⏱ Tempo pedido pelo '+AV.meu.tag+'.';
  const l={texto:'⏱ '+AV.meu.tag+' pede tempo — '+r.restam+' restante(s) neste mapa.',
           peso:0.5,meu:true,lado:AV.linhas[0]?AV.linhas[0].lado:'atk',
           placar:AV.linhas[0]?AV.linhas[0].placar:{meu:AV.S.M.sa,dele:AV.S.M.sb},
           tempo:true};
  AV.aviso=null;
  AV.linhas.unshift(l);
  avPintar();
}

function avMapaAtual(){return AV.res.mapas[AV.mapaIdx];}
/* O botão de tempo só aparece quando ele pode fazer alguma coisa: partida
   sendo conduzida, mapa em andamento, preferência ligada e tempo sobrando. */
function avPodePedirTempo(){
  return !!(AV&&AV.conduzida&&AV.S&&AV.S.M&&!AV.fim
            &&Prefs.get('tempoTecnico')
            &&typeof podePedirTempo==='function'&&podePedirTempo(AV.S.M,AV.souA));
}
function avNarracaoAtual(){
  return narrarMapa(avMapaAtual(),AV.souA,AV.meu.tag,AV.adv.tag);
}

function avAgendar(ms){
  if(!AV||AV.fim)return;
  if(AV.timer)clearTimeout(AV.timer);
  if(AV.pausado)return;
  AV.timer=setTimeout(avPasso,Math.max(60,ms));
}

function avPasso(){
  if(!AV||AV.fim)return;
  if(AV.conduzida)return avPassoConduzido();
  /* Passar do último mapa não é um estado possível de desenhar: avMapaAtual()
     devolve undefined e a narração quebra ao ler o histórico dele. Acontecia
     de verdade — o timer do avanço automático dispara mais uma vez depois de
     você clicar em "pular para o fim", e a tela morria com a partida já
     decidida. */
  if(AV.mapaIdx>=AV.res.mapas.length){AV.fim=true;avPintar(true);return;}
  const mapa=avMapaAtual();
  const narr=avNarracaoAtual();
  if(AV.roundIdx>=narr.length){
    /* mapa acabou */
    const meu=AV.souA?mapa.sa:mapa.sb, dele=AV.souA?mapa.sb:mapa.sa;
    AV.mapasFeitos.push({mapa:mapa.mapa,meu,dele,
      fecho:narrarFimDeMapa(mapa,AV.souA,AV.meu.tag,AV.adv.tag)});
    AV.mapaIdx++;AV.roundIdx=0;AV.linhas=[];
    if(AV.mapaIdx>=AV.res.mapas.length){AV.fim=true;avPintar(true);return;}
    avPintar();avAgendar(1600/AV.vel);   /* respiro entre mapas */
    return;
  }
  const l=narr[AV.roundIdx];
  AV.linhas.unshift(l);
  AV.roundIdx++;
  avPintar();
  const ms=(AV_MS_BASE+(AV_MS_PICO-AV_MS_BASE)*l.peso)*AV.vel;
  avAgendar(ms);
}

function avPular(){
  if(!AV)return;
  if(AV.timer)clearTimeout(AV.timer);
  if(AV.conduzida){
    const res=avEncerrarConduzida();
    if(AV.aoFim)AV.aoFim(res);
    AV.linhas=[];
    avPintar(true);
    return;
  }
  /* completa o que falta sem animar, para o resumo final ficar correto */
  while(AV.mapaIdx<AV.res.mapas.length){
    const mapa=avMapaAtual();
    const meu=AV.souA?mapa.sa:mapa.sb, dele=AV.souA?mapa.sb:mapa.sa;
    if(!AV.mapasFeitos.some(x=>x.mapa===mapa.mapa))
      AV.mapasFeitos.push({mapa:mapa.mapa,meu,dele,
        fecho:narrarFimDeMapa(mapa,AV.souA,AV.meu.tag,AV.adv.tag)});
    AV.mapaIdx++;
  }
  AV.linhas=[];
  AV.fim=true;
  avPintar(true);
}

function avPintar(fim){
  if(!AV)return;
  /* No modo conduzido o mapa corrente ainda está sendo jogado: ele vem do
     estado do motor, não da lista de mapas prontos. */
  /* Entre um mapa e o outro, o estado do motor é nulo por um instante — e a
     tela pintava "mapa 2 de 3" sem nome, 0 a 0 e sem feed. Nesse intervalo o
     que interessa é o mapa que ACABOU, com o próximo anunciado. */
  const noIntervalo=AV.conduzida&&!AV.S.M&&!AV.fim;
  const ultimoFeito=AV.conduzida?(AV.S.mapas[AV.S.mapas.length-1]||null):null;
  const mapa=AV.conduzida
    ?(AV.S.M?{mapa:AV.S.M.mapa,sa:AV.S.M.sa,sb:AV.S.M.sb,hist:AV.S.M.hist}
            :(ultimoFeito||{mapa:'—',sa:0,sb:0,hist:[]}))
    :AV.res.mapas[Math.min(AV.mapaIdx,AV.res.mapas.length-1)];
  const proximoMapa=noIntervalo?(AV.S.veto.mapas[AV.S.idx]||null):null;
  const totalMapas=AV.conduzida?AV.S.veto.mapas.length:AV.res.mapas.length;
  const parcial=AV.linhas.find(x=>x&&x.placar&&!x.tempo)||AV.linhas[0];
  const meuR=noIntervalo?(AV.souA?mapa.sa:mapa.sb)
    :parcial&&parcial.placar?parcial.placar.meu:(fim?(AV.souA?mapa.sa:mapa.sb):0);
  const delR=noIntervalo?(AV.souA?mapa.sb:mapa.sa)
    :parcial&&parcial.placar?parcial.placar.dele:(fim?(AV.souA?mapa.sb:mapa.sa):0);
  const mapasMeu=AV.mapasFeitos.filter(x=>x.meu>x.dele).length;
  const mapasDel=AV.mapasFeitos.filter(x=>x.dele>x.meu).length;
  const venci=AV.res.vencedor===AV.meu.id;

  const cabeca=`
    <div class="av-placar">
      <div class="av-lado ${meuR>delR?'up':''}">
        ${escudo(AV.meu,44)}<div><b>${esc(AV.meu.tag)}</b><span class="dim">${esc(AV.meu.nome)}</span></div>
      </div>
      <div class="av-numeros">
        <div class="av-rounds"><span class="${meuR>delR?'up':''}">${meuR}</span>
          <i>·</i><span class="${delR>meuR?'dn':''}">${delR}</span></div>
        <div class="av-mapas">mapas ${mapasMeu} — ${mapasDel}</div>
      </div>
      <div class="av-lado r ${delR>meuR?'dn':''}">
        <div class="r"><b>${esc(AV.adv.tag)}</b><span class="dim">${esc(AV.adv.nome)}</span></div>${escudo(AV.adv,44)}
      </div>
    </div>`;

  const trilha=(()=>{
    if(fim)return '<div class="av-trilha"></div>';
    if(AV.conduzida){
      const h=(AV.S.M&&AV.S.M.hist)||(ultimoFeito&&ultimoFeito.hist)||[];
      return `<div class="av-trilha">${h.map((x,i)=>{
        const meuW=AV.souA?x.v:!x.v;
        const lado=AV.souA?x.lado:(x.lado==='atk'?'def':'atk');
        return `<i class="${meuW?'w':'l'} ${lado}"${i===h.length-1?' data-agora':''}></i>`;
      }).join('')}</div>`;
    }
    const narr=avNarracaoAtual();
    const ate=AV.roundIdx;
    return `<div class="av-trilha">${narr.slice(0,ate).map((x,i)=>
      `<i class="${x.meu?'w':'l'} ${x.lado}"${i===ate-1?' data-agora':''}></i>`).join('')}</div>`;
  })();

  const corpo=fim?`
    <div class="av-fim ${venci?'bom':'ruim'}">
      <div class="av-fim-t">${venci?'Vitória':'Derrota'}</div>
      <div class="dim">${esc(AV.meu.nome)} ${mapasMeu} — ${mapasDel} ${esc(AV.adv.nome)}</div>
    </div>
    <div class="card flat"><div class="eyebrow">Como foi</div>
      ${AV.mapasFeitos.map(m=>`<div class="av-linha ${m.fecho.tom}">
        <span class="num dim">${m.meu}–${m.dele}</span> ${esc(m.fecho.texto)}</div>`).join('')}
    </div>`
   :`
    <div class="av-mapa"><span class="eyebrow">Mapa ${Math.min(AV.mapaIdx+1,totalMapas)} de ${totalMapas}</span>
      <b>${esc(mapa.mapa)}</b>
      ${noIntervalo&&proximoMapa?`<span class="chip">a seguir · ${esc(proximoMapa)}</span>`
        :parcial?`<span class="chip ${parcial.lado==='atk'?'':'g'}">${parcial.lado==='atk'?'ataque':'defesa'}</span>`:''}
    </div>
    ${trilha}
    ${noIntervalo&&AV.mapasFeitos.length?`<div class="av-feed">
      ${AV.mapasFeitos.slice().reverse().map(m=>`<div class="av-linha ${m.fecho.tom}">
        <span class="num dim">${m.meu}–${m.dele}</span> ${esc(m.fecho.texto)}</div>`).join('')}
    </div>`:''}
    <div class="av-feed">${AV.linhas.slice(0,9).map((x,i)=>
      `<div class="av-linha ${x.tempo?'tempo':(x.meu?'bom':'ruim')}${i===0?' novo':''}">
        <span class="num dim">${x.placar?x.placar.meu+'–'+x.placar.dele:'·'}</span> ${esc(x.texto)}</div>`).join('')}
    </div>`;

  const controles=fim?`
    <button class="btn" id="avFicha">Ver a ficha completa</button>
    <button class="btn ghost" id="avSair">Fechar</button>`
   :`
    <button class="btn ghost" id="avPausa">${AV.pausado?'Continuar':'Pausar'}</button>
    ${avPodePedirTempo()?`<button class="btn" id="avTempo">⏱ Pedir tempo
      <span class="chip">${AV.S.M?(AV.souA?AV.S.M.temposA:AV.S.M.temposB):0}</span></button>`:''}
    <span class="av-vels">${AV_VEL.map(([v,rot,mult])=>
      `<button class="${Math.abs(AV.vel-mult)<0.01?'on':''}" data-vel="${mult}">${rot}</button>`).join('')}</span>
    <button class="btn" id="avPular">Pular para o fim</button>`;

  abrir(`<div class="aovivo">${cabeca}${corpo}
    <div class="av-controles">${controles}</div></div>`,true);

  const on=(sel,fn)=>{const el=$('#modal').querySelector(sel);if(el)el.onclick=fn;};
  on('#avPausa',()=>{AV.pausado=!AV.pausado;avPintar();if(!AV.pausado)avAgendar(120);});
  on('#avTempo',()=>{avPedirTempo();if(!AV.pausado)avAgendar(700);});
  on('#avPular',avPular);
  on('#avFicha',()=>{const r=AV.res;avFechar();aba=0;modalPartida(r);});
  on('#avSair',avFechar);
  $('#modal').querySelectorAll('[data-vel]').forEach(b=>b.onclick=()=>{
    AV.vel=parseFloat(b.dataset.vel);
    Prefs.set('velocidadeAoVivo',String(AV.vel));
    avPintar();avAgendar(120);
  });
}

function edTimesOrdenados(){

    `</optgroup>`).join('');

function edChip(p){
  const t=p.timeId?T(p.timeId):null;

/* ============================================================

   ============================================================ */
function edvJogadores(){
  let lista=Object.values(G.jogadores);
  const f=edFiltro;
  if(f.status==='livres')lista=lista.filter(p=>!p.timeId);
  if(f.status==='clube')lista=lista.filter(p=>p.timeId);
  if(f.time)lista=lista.filter(p=>p.timeId===f.time);
  if(f.role)lista=lista.filter(p=>p.role===f.role);
  if(f.reg)lista=lista.filter(p=>p.timeId?T(p.timeId).regiao===f.reg:p.regiaoOrigem===f.reg);
  if(f.busca){const q=f.busca.toLowerCase();lista=lista.filter(p=>p.nome.toLowerCase().includes(q));}
  const total=lista.length;
  lista.sort((a,b)=>f.ordem==='over'?over(b)-over(a)
    :f.ordem==='pot'?b.pot-a.pot
    :f.ordem==='idade'?a.idade-b.idade
    :a.nome.localeCompare(b.nome));
  const corte=lista.slice(0,80);

  return `
  <div class="card flat"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <input type="text" id="edfBusca" placeholder="Buscar nick" value="${esc(f.busca)}" style="width:170px">

    <select id="edfRole"><option value="">Todas as funções</option>${ROLES.map(r=>
      `<option ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
    <select id="edfReg"><option value="">Todas as regiões</option>${REGIONS.map(r=>
      `<option value="${r.id}" ${f.reg===r.id?'selected':''}>${esc(r.nome)}</option>`).join('')}</select>
    ${edSelectTimes('id="edfTime" style="max-width:200px"',f.time,true).replace('— Sem clube —','— Qualquer clube —')}
    <select id="edfOrdem">${[['over','Over'],['pot','Potencial'],['idade','Idade'],['nome','Nome']]
      .map(([k,n])=>`<option value="${k}" ${f.ordem===k?'selected':''}>Ordenar por ${n.toLowerCase()}</option>`).join('')}</select>
    <span class="dim num">${total} encontrado(s)${total>80?' · mostrando 80':''}</span>
  </div></div>

  <div class="card flat"><table class="wide"><thead><tr><th></th><th>Nick</th><th>Clube</th><th>Função</th>
    <th class="c">Idade</th><th class="c">País</th><th class="c">Over</th><th class="c">Pot</th>
    <th class="r">Valor</th><th>Mover para</th><th class="r">Ações</th></tr></thead>
    <tbody>${corte.map(p=>`<tr>
      <td>${retrato(p,28)}</td>
      <td><b>${esc(p.nome)}</b></td>
      <td>${edChip(p)}</td>
      <td><span class="tag ${p.role}">${p.role}</span></td>
      <td class="c num">${p.idade}</td>
      <td class="c">${FLAG[p.pais]||''} <span class="dim num">${esc(p.pais)}</span></td>
      <td class="c">${ovTag(p)}</td>
      <td class="c num dim">${p.pot}</td>
      <td class="r num">${money(p.valor)}</td>
      <td>${edSelectTimes('data-edmover="'+p.id+'" style="max-width:150px"',p.timeId,true)}</td>
      ${edLinhaAcoes(p)}</tr>`).join('')||'<tr><td colspan="11" class="dim">Nada encontrado.</td></tr>'}
    </tbody></table></div>`;
}

/* ============================================================
   ABA IMAGENS
   ============================================================ */
function edvImagens(){
  const itens=[...Imgs.cache.keys()].sort();
  const alvo=k=>{
    const slug=k.slice(k.indexOf(':')+1);
    if(k.startsWith('logo:')){
      const t=Object.values(G.times).find(x=>ASSETS.slug(x.tag)===slug);
      return t?{nome:t.nome,extra:'escudo · '+t.tag,orfa:false}:{nome:slug,extra:'sem time',orfa:true};
    }
    if(k.startsWith('arte:')){
      const tor=G.torneios&&Object.values(G.torneios).find(x=>ASSETS.slug(x.id)===slug);
      return tor?{nome:tor.nome,extra:'torneio',orfa:false}:{nome:slug,extra:'sem torneio',orfa:true};
    }
    if(k.startsWith('agente:')){
      const ag=todosAgentes().find(a=>ASSETS.slug(a.nome)===slug);
      return ag?{nome:ag.nome,extra:'agente · '+ag.role,orfa:false}:{nome:slug,extra:'sem agente',orfa:true};
    }
    const p=Object.values(G.jogadores).find(x=>ASSETS.slug(x.nome)===slug);
    return p?{nome:p.nome,extra:'foto · '+(p.timeId?T(p.timeId).tag:'sem clube'),orfa:false}
            :{nome:slug,extra:'sem jogador',orfa:true};
  };
  const kb=Math.round(Imgs.bytes()/1024);
  const modoTxt={indexeddb:'IndexedDB — o pacote sobrevive ao fechar o navegador',
    memoria:'somente memória — exporte o pacote antes de fechar'}[Imgs.modo];

  return `
  <div class="card"><div class="eyebrow">Como o pacote funciona</div>
    <p class="dim">Rodando por <code>file://</code> o navegador não pode gravar em <code>assets/</code>,
    então subir imagem aqui guarda no <b>pacote</b>: um store próprio do IndexedDB, separado da run.
    O save continua leve e você pode trocar o pacote sem tocar na partida. Toda imagem entra
    reduzida para ${Imgs.lado}×${Imgs.lado} PNG.</p>
    <p class="dim" style="margin-top:8px">A chave segue a mesma convenção da pasta:
    <code>logo:&lt;tag&gt;</code> e <code>foto:&lt;nick&gt;</code>. Renomear tag ou nick no Editor
    re-chaveia a imagem em vez de perdê-la. Se um dia você colocar os arquivos em
    <code>assets/</code>, é só limpar o pacote — a resolução cai para a pasta sozinha.</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">
      <span class="pill">${Imgs.quantos()} imagem(ns)</span>
      <span class="pill">${kb} KB</span>
      <span class="chip ${Imgs.modo==='indexeddb'?'t':''}">${modoTxt}</span>
    </div>
  </div>

  <div class="card"><div class="eyebrow">Subir em lote</div>
    <p class="dim">Solte vários PNG de uma vez. O destino sai do nome do arquivo pelo slug:
    <code>sen.png</code> vira o escudo da tag SEN, <code>champions.png</code> a arte do torneio,
    <code>jett.png</code> o retrato do agente e <code>aspas.png</code> a foto do jogador.
    A ordem de busca é tag, torneio, agente, jogador — arquivo que não casa é reportado e ignorado.</p>
    <div class="dropzone" id="edDropLote">Arraste os arquivos aqui ou
      <label class="lk">escolha os arquivos<input type="file" id="edFileLote" accept="image/*" multiple style="display:none"></label>
    </div>
    ${edFeedImg?`<div style="margin-top:10px">${edFeedImg}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" id="edImgExport">Exportar pacote .json</button>
      <label class="btn ghost lk" style="display:inline-block">Importar pacote
        <input type="file" id="edImgImport" accept=".json" style="display:none"></label>
      <button class="btn ghost" id="edImgLimpar">Limpar pacote</button>
    </div>
  </div>

  <div class="card flat"><div class="eyebrow">No pacote</div>
    ${itens.length?`<div class="imggrid">${itens.map(k=>{const a=alvo(k);
      return `<div class="imgcard ${a.orfa?'orfa':''}">
        <img src="${Imgs.get(k)}" width="56" height="56" alt="">
        <div class="n"><b>${esc(a.nome)}</b><div class="dim">${esc(a.extra)}</div></div>
        <button class="btn ghost sm" data-edimgdel="${esc(k)}">✕</button></div>`;}).join('')}</div>`
      :'<div class="empty">Nenhuma imagem no pacote. O jogo desenha monograma no lugar.</div>'}
    ${itens.some(k=>alvo(k).orfa)?'<p class="dim" style="margin-top:8px">Itens marcados em vermelho não casam com nenhuma tag ou nick da base — provavelmente sobraram de um rename feito fora do Editor.</p>':''}
  </div>`;
}

/* ============================================================
   IMPORTADOR / EXPORTADOR EM TEXTO
   ============================================================ */
function acharTime(chave){
  const c=String(chave).trim().toLowerCase();
  return Object.values(G.times).find(t=>t.tag.toLowerCase()===c)
      || Object.values(G.times).find(t=>t.nome.toLowerCase()===c)
      || Object.values(G.times).find(t=>t.nome.toLowerCase().startsWith(c)&&c.length>2);
}
const ED_LIVRE=['livre','livres','sem clube','semclube','free','-'];
function importarElencos(texto,modo){
  const usados=edNomesUsados();
  const linhas=texto.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('//')&&!l.startsWith('#'));
  const limpos=new Set();let add=0,ren=0,erros=[];
  const tocados=new Set();
  for(const linha of linhas){
    if(!/[|;\t]/.test(linha)&&linha.includes('=')){
      const[a,b]=linha.split('=');const t=acharTime(a);
      if(!t){erros.push('Time não encontrado: '+a.trim());continue;}
      const novo=b.trim();
      const tagAntes=t.tag;
      if(novo.includes('/')){const[n,g]=novo.split('/');
        const r=edAplicarTime(t.id,{nome:n.trim(),tag:g.trim()});
        if(!r.ok){erros.push(r.erro);continue;}
        if(r.tagTrocada)Imgs.renomear(Imgs.chaveTime(tagAntes),Imgs.chaveTime(t.tag));
      }else edAplicarTime(t.id,{nome:novo});
      ren++;continue;
    }
    const c=linha.split(/\s*[|;\t]\s*/);
    if(c.length<3){erros.push('Linha inválida: '+linha);continue;}
    const chave=c[0].trim();
    const livre=ED_LIVRE.includes(chave.toLowerCase());
    const t=livre?null:acharTime(chave);
    if(!livre&&!t){erros.push('Time não encontrado: '+chave);continue;}
    if(t&&modo==='substituir'&&!limpos.has(t.id)){
      limpos.add(t.id);
      /* passa por edApagar em vez de deletar na mão: é ele que limpa proposta,
         plano de treino e IGL apontando para quem deixou de existir */
      t.elenco.slice().forEach(id=>{edApagar(id);});
      t.elenco=[];t.titulares=[];t.igl=null;
    }
    const nome=c[1].trim();
    let role=(c[2]||'').trim();
    role=ROLES.find(r=>r.toLowerCase()===role.toLowerCase())
      ||{duel:'Duelista',dueli:'Duelista',init:'Iniciador',inic:'Iniciador',contr:'Controlador',
         control:'Controlador',sent:'Sentinela',sentin:'Sentinela',flex:'Flex'}[role.toLowerCase().slice(0,6)]
      ||'Flex';
    const ov=clamp(parseInt(c[3])||(t?Math.round(t.prestigio):56),30,99);
    const pot=clamp(parseInt(c[4])||0,0,99);
    const idade=clamp(parseInt(c[5])||ri(19,25),15,40);
    const regiao=t?REGIONS.find(r=>r.id===t.regiao):REGIONS[0];
    const pais=(c[6]||'').trim().toUpperCase()||pick(regiao.paises);
    if(t&&t.elenco.length>=9){erros.push('Elenco cheio em '+t.tag+': '+nome);continue;}
    const p=makePlayer(ov,role,pais,idade,usados);
    p.nome=nome;
    aplicarOver(p,ov);
    p.pot=Math.max(pot,over(p));
    p.salario=salario(p);p.valor=valor(p);
    G.jogadores[p.id]=p;
    if(t){p.contrato=ri(2,3);p.timeId=t.id;t.elenco.push(p.id);tocados.add(t.id);}
    else{p.contrato=0;p.timeId=null;p.regiaoOrigem=regiao.id;G.livres.push(p.id);}
    add++;
  }
  tocados.forEach(id=>edRemendarEscalacao(G.times[id]));
  limpos.forEach(id=>{const t=G.times[id];
    if(t.elenco.length<5)edPreencherElenco(id,5);
    edRemendarEscalacao(t);});
  return{add,ren,erros};
}
function exportarElencos(){
  const times=Object.values(G.times).map(t=>
    '// '+t.nome+'\n'+t.tag+' = '+t.nome+' / '+t.tag+'\n'+
    t.elenco.map(id=>{const p=P(id);
      return [t.tag,p.nome,p.role,over(p),p.pot,p.idade,p.pais].join(' | ');}).join('\n')
  ).join('\n\n');
  const livres=G.livres.map(P).filter(Boolean);
  if(!livres.length)return times;
  return times+'\n\n// Sem clube\n'+livres.map(p=>
    ['LIVRE',p.nome,p.role,over(p),p.pot,p.idade,p.pais].join(' | ')).join('\n');
}

      <span class="dim">Semente</span><input type="number" id="runSeed" value="${Math.floor(Math.random()*900000)+1000}" style="width:120px">
      <button class="btn" id="runNova">Criar mundo</button></div>
  </div>`;
}
/* monta um mundo novo em pré-run. Não navega: quem chamou decide para onde
   ir, porque o menu e o botão de dentro do jogo querem destinos diferentes. */
function iniciarPreRun(seed){
  criarMundo(seed);montarCalendario();
  G.runId=novaRunId();G.runNome='Run '+new Date().toLocaleDateString('pt-BR');
  G.meuTime=null;
  tela='inicio';hist=[];histPos=-1;
}


/* ===== src/ui/events.js ===== */
/* ============================================================
   EVENTOS
   ============================================================ */
function ligarEventos(){
  const t=meu();const v=raizAtual();
  if(!v)return;
  const on=(sel,f)=>v.querySelectorAll(sel).forEach(el=>el.onclick=e=>{e.stopPropagation();f(el);});
  /* Lê um campo do formulário sem confiar que ele está na tela. Um botão de um
     render anterior continua clicável enquanto alguém tiver a referência dele,
     e aí `v.querySelector('#edNome').value` estourava em cima de null. Ler por
     aqui devolve vazio e o formulário simplesmente não aplica nada. */
  const val=(sel,padrao)=>{const el=v.querySelector(sel);return el?el.value:(padrao===undefined?'':padrao);};
  const temCampo=sel=>!!v.querySelector(sel);
  on('[data-ca]',el=>{compAba=el.dataset.ca;render();});
  on('#autoEsc',()=>{autoEscalar(t);render();});
  on('[data-banco]',el=>{
    if(t.titulares.length<=5&&t.elenco.length>5){
      const sub=t.elenco.find(i=>!t.titulares.includes(i)&&!P(i).lesao);
      if(!sub)return;
      t.titulares=t.titulares.map(i=>i===el.dataset.banco?sub:i);
      t.sinergia=clamp(t.sinergia-5,0,100);
    }
    t.elenco.forEach(i=>P(i).igl=(i===t.igl));
    if(!t.titulares.includes(t.igl))t.igl=t.titulares[0];
    render();
  });
  on('[data-tit]',el=>{
    const sai=t.titulares.map(P).sort((a,b)=>over(a)-over(b))[0];
    t.titulares=t.titulares.map(i=>i===sai.id?el.dataset.tit:i);
    t.sinergia=clamp(t.sinergia-5,0,100);
    if(!t.titulares.includes(t.igl))t.igl=t.titulares[0];
    t.elenco.forEach(i=>P(i).igl=(i===t.igl));render();
  });
  on('[data-igl]',el=>{t.igl=el.dataset.igl;t.elenco.forEach(i=>P(i).igl=(i===t.igl));render();});
  on('[data-up]',el=>{
    const[grp,k]=el.dataset.up.split('.');
    const c=custoUpgrade(t[grp][k]);
    if(t.caixa<c){alert('Caixa insuficiente: '+money(c)+' necessários.');return;}
    t.caixa-=c;t[grp][k]++;noticia('Estrutura melhorada: '+k+' nível '+t[grp][k]+'.');render();
  });
  on('[data-prop]',el=>modalProposta(el.dataset.prop));
  on('[data-assumir]',el=>{
    const r=assumirClube(el.dataset.assumir);
    if(!r.ok){alert(r.erro||'Não deu para assumir esse clube.');return;}
    flash(r.msg);irPara('inicio');
  });
  on('[data-treinomapa]',el=>{definirMapaTreino(t,el.dataset.treinomapa||null);render();});
  on('[data-anunciar]',el=>modalAnunciar(el.dataset.anunciar));
  on('[data-desanunciar]',el=>{
    const r=retirarAnuncio(P(el.dataset.desanunciar));
    if(r&&r.msg)noticia(r.msg);
    render();
  });
  on('[data-aceitar]',el=>{
    const r=aceitarProposta(el.dataset.aceitar);
    if(!r.ok){alert(r.erro||'A proposta não pôde ser aceita.');return;}
    noticia('🤝 '+r.msg);render();
  });
  on('[data-recusar]',el=>{recusarProposta(el.dataset.recusar);render();});
  on('[data-renov]',el=>{
    const p=P(el.dataset.renov);const novo=Math.round(salario(p)*1.12/100)*100;
    if(confirm('Renovar '+p.nome+' por 3 anos a '+money(novo)+'/mês?')){p.contrato=3;p.salario=novo;p.moral=clamp(p.moral+.08,0,1);render();}
  });
  on('[data-disp]',el=>{
    const p=P(el.dataset.disp);
    if(t.elenco.length<=5){alert('Você precisa de pelo menos 5 jogadores.');return;}
    if(confirm('Dispensar '+p.nome+'? Multa de '+money(p.salario*p.contrato*6)+'.')){
      t.caixa-=p.salario*p.contrato*6;liberar(p);render();}
  });
  /* ---- conversa com o elenco ---- */
  on('[data-conversa]',el=>{
    const [pid,opcao]=String(el.dataset.conversa).split(':');
    const r=conversarCom(t,P(pid),opcao);
    if(!r.ok){alert(r.erro);return;}
    fechar();
    flash(r.msg+(r.delta?' (moral '+(r.delta>0?'+':'')+r.delta+')':''));
  });
  /* ---- comps de agente ---- */
  on('[data-compmapa]',el=>{compMapa=el.dataset.compmapa;render();});
  on('[data-preset]',el=>{aplicarPreset(t,mapaDaTelaComps(),el.dataset.preset);render();});
  on('[data-presettodos]',el=>{
    for(const mp of (G.mapasAtivos||[]))aplicarPreset(t,mp,el.dataset.presettodos);

  v.querySelectorAll('[data-compag]').forEach(el=>el.onchange=()=>{
    definirAgente(t,mapaDaTelaComps(),el.dataset.compag,el.value);

  });
  /* o select de plano individual não é clique, é change */
  v.querySelectorAll('[data-plano]').forEach(el=>el.onchange=()=>{

  bind('#fBusca','input',e=>{mFiltro.busca=e.target.value;const p=e.target.selectionStart;render();

  /* filtros da aba Jogadores — preserva o cursor da busca */

  /* ---------- imagens ---------- */
  const subirPara=async(chave,file)=>{
    try{
      const[lg,al]=Imgs.formatoDaChave(chave);

      ${semAlvo.length?'<div style="margin-top:6px">Sem alvo na base (o nome tem de casar com uma tag ou um nick): <span class="dim">'+semAlvo.slice(0,10).map(esc).join(', ')+'</span></div>':''}
      ${falhou.length?'<div style="margin-top:6px">Não deu para ler: <span class="dim">'+falhou.map(esc).join(', ')+'</span></div>':''}</div>`;

    if(!confirm('Limpar as '+Imgs.quantos()+' imagens do pacote? A resolução volta para a pasta assets/.'))return;

  on('#edFixCurtos',()=>{

    'Se este save é antigo, entre no jogo, abra o Editor e clique em Padronizar '+
    'antes de exportar.';
  on('#vlrGo',()=>{
    const sel=v.querySelector('#vlrTime');
    const t=sel&&G.times[sel.value];
    const r=parsearVlr(val('#vlrTxt'),t?t.tag:'');
    const el=document.getElementById('vlrFeed');
    if(!r.ok){if(el)el.innerHTML=`<div class="card flat" style="border-left:4px solid var(--red)">${esc(r.erro)}</div>`;return;}
    /* prévia obrigatória: colagem errada não pode virar elenco sem você ver */
    if(el)el.innerHTML=`
      <div class="card flat"><div class="eyebrow">Entendi isto · colagem em ${r.formato}</div>
      <table><thead><tr><th>Nick</th><th>Nome real</th><th class="c">País</th></tr></thead>
      <tbody>${r.jogadores.map(j=>`<tr><td><b>${esc(j.nick)}</b></td>
        <td class="dim">${esc(j.nome)||'—'}</td>
        <td class="c">${j.pais?(FLAG[j.pais]||'')+' '+esc(j.pais):'<span class="dn">—</span>'}</td></tr>`).join('')}
      </tbody></table>
      ${r.staff.length?`<div class="eyebrow" style="margin-top:12px">Separados como comissão</div>
        <table><tbody>${r.staff.map(s2=>`<tr><td><b>${esc(s2.nick)}</b></td>
          <td class="dim">${esc(s2.nome)||'—'}</td>
          <td class="dim">${esc(s2.rotulo||'comissão')}</td></tr>`).join('')}</tbody></table>`:''}
      ${r.avisos.map(a=>'<div class="dim" style="margin-top:6px">· '+esc(a)+'</div>').join('')}
      <div style="margin-top:10px"><button class="btn" id="vlrUsar">Usar estas linhas no importador</button></div>
      </div>`;
    const btn=document.getElementById('vlrUsar');
    if(btn)btn.onclick=()=>{
      const alvo=v.querySelector('#impTxt');
      if(alvo){alvo.value=r.linhas;alvo.scrollIntoView({block:'center'});
        flash(r.jogadores.length+' linha(s) prontas — revise função e over antes de importar.');}
    };
  });
  on('#paisGo',()=>{
    const r=edAplicarPaises(val('#paisTxt'));
    render();
    const el=document.getElementById('paisFeed');
    if(el)el.innerHTML=`<div class="${r.erros.length?'card flat':'ok'}">${r.n} clube(s) atualizado(s).`+
      (r.erros.length?'<div style="margin-top:6px" class="dn">'+r.erros.map(esc).join('<br>')+'</div>':'')+'</div>';
    flash(r.n+' clube(s) com sede definida.');
  });
  on('#paisExp',()=>{
    const el=v.querySelector('#paisTxt');
    if(el){el.value=edListarPaises();flash('Lista atual carregada — edite e aplique.');}
  });
  on('#edGerarClubes',()=>{
    const js=gerarClubesJS();
    if(!js){flash('Nenhum clube com sede definida ainda — preencha os países antes.');return;}
    baixarTexto('clubes.js',js,'text/javascript');
    flash('clubes.js baixado — copie por cima do que está em data/.');
  });
  on('#edGerarElencos',()=>{
    const js=gerarElencosJS();
    if(!js){flash(avisoVazio);return;}
    baixarTexto('elencos.js',js,'text/javascript');
    flash(quantosReais()+' jogadores exportados — mova o arquivo para a pasta data/.');
  });
  on('#edVerElencos',()=>{
    const js=gerarElencosJS();
    if(!js){flash(avisoVazio);return;}
    edSaida=js;render();
  });
  on('#edNovo',()=>{
    if(!confirm('Isso apaga a base editada e gera um mundo novo. Continuar?'))return;
    iniciarPreRun(Math.floor(Math.random()*900000)+1000);
  });

  /* ---------- pré-run ---------- */
  on('#prIniciar',()=>telaNovoJogo());

  /* ---------- configurações ---------- */
  on('[data-pref]',el=>{
    const k=el.dataset.pref,novo=!Prefs.get(k);
    Prefs.set(k,novo);
    el.classList.toggle('on',novo);
    el.setAttribute('aria-checked',String(novo));
    if(k==='animacoes')document.body.classList.toggle('sem-anim',!novo);
  });
  bind('#cfgRostos','change',e=>{Prefs.set('rostosGerados',e.target.value);render();});
  on('#cfgApagarRuns',async()=>{
    if(!listaRuns.length){flash('Não há partidas salvas.');return;}
    if(!confirm('Apagar as '+listaRuns.length+' partidas salvas? Não tem desfazer.'))return;
    for(const r of listaRuns.slice())await Storage.apagar(r.id);
    await atualizarRuns();render();flash('Partidas apagadas.');
  });
  on('#cfgLimparImgs',async()=>{
    if(!Imgs.quantos()){flash('O pacote já está vazio.');return;}
    if(!confirm('Limpar as '+Imgs.quantos()+' imagens do pacote?'))return;
    await Imgs.limpar();render();flash('Pacote limpo.');
  });

  /* ---------- runs ---------- */
  on('#runSalvar',async()=>{
    const n=val('#runNome').trim()||G.runNome||'Sem nome';
    const ok=await salvarRun(n);
    await atualizarRuns();render();flash(ok?'Run salva.':'Falha ao salvar — exporte o .json.');
  });
  on('#runBaixar',()=>{baixarRun();flash('Arquivo gerado.');});
  on('#runNova',()=>{
    const seed=parseInt(val('#runSeed'))||Math.floor(Math.random()*900000)+1000;
    if(G&&G.meuTime&&!confirm('Criar um mundo novo? Salve a run atual antes se quiser mantê-la.'))return;
    iniciarPreRun(seed);
  });
  on('[data-runload]',async el=>{
    const ok=await carregarRun(el.dataset.runload);
    if(!ok){flash('Não foi possível carregar essa run.');return;}
    tela='inicio';render();flash('Run carregada.');
  });
  on('[data-rundel]',async el=>{
    if(!confirm('Apagar esta run definitivamente?'))return;
    await Storage.apagar(el.dataset.rundel);await atualizarRuns();render();
  });
  const dz=v.querySelector('#runDrop'),fi=v.querySelector('#runFile');
  if(dz){
    const receber=async file=>{
      try{
        const reg=await lerArquivoRun(file);
        if(!desempacotarRun(reg)){flash('Arquivo não parece uma run válida.');return;}
        await salvarRun(G.runNome);await atualizarRuns();
        tela='inicio';render();flash('Run importada.');
      }catch(e){flash('Erro ao ler o arquivo.');}
    };
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='var(--red)';});
    dz.addEventListener('dragleave',()=>{dz.style.borderColor='';});
    dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='';
      if(e.dataTransfer.files[0])receber(e.dataTransfer.files[0]);});
    if(fi)fi.addEventListener('change',e=>{if(e.target.files[0])receber(e.target.files[0]);});
  }
}

/* ============================================================
   NOVO JOGO
   ============================================================ */
let escRegiao='AMER',escTier=1,escPapel='treinador',escNome='';
function telaNovoJogo(){
  const val=edValidar();
  if(!val.ok){
    /* deixar começar com a base quebrada gera erro no meio da temporada, longe
       da causa; melhor barrar aqui e mandar para a aba que explica o problema */
    $('#modal').innerHTML=`<div class="ovl"><div class="box">
      <div class="eyebrow">Não dá para começar ainda</div>
      <h2 class="sec">${val.erros.length} erro(s) na base</h2>
      <p class="dim">O Editor deixa a base ficar inconsistente enquanto você monta, mas a temporada
      precisa dela fechada. Resolva o que está abaixo e volte.</p>
      <div class="card flat" style="margin-top:10px"><div class="feed">
        ${val.erros.slice(0,14).map(e=>'<div class="err">· '+esc(e)+'</div>').join('')}
        ${val.erros.length>14?'<div class="dim">… e mais '+(val.erros.length-14)+'</div>':''}
      </div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn" id="njValidar">Abrir a aba Validação</button>
        <button class="btn ghost" data-close>Fechar</button></div></div></div>`;
    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=fechar);
    $('#njValidar').onclick=()=>{tela='editor';edAba='validar';$('#modal').innerHTML='';render();};
    return;
  }
  const times=G?G.regioes[escRegiao][escTier===1?'t1':'t2'].slice().sort((a,b)=>T(b).prestigio-T(a).prestigio):[];
  $('#modal').innerHTML=`<div class="ovl"><div class="box wide">
    <div class="eyebrow">Novo jogo</div><h2 class="sec">Quem é você</h2>
    <div class="nj-quem">
      <label class="dim">Seu nome
        <input type="text" id="njNome" value="${esc(escNome)}" maxlength="28"
          placeholder="como a imprensa vai te chamar"></label>
      <div class="nj-papeis">${PAPEIS.map(p=>`
        <button class="nj-papel ${escPapel===p.id?'on':''}" data-papel="${p.id}">
          <b>${esc(p.nome)}</b>
          <span>${esc(p.resumo)}</span>
          <i>${esc(p.detalhe)}</i>
        </button>`).join('')}</div>
    </div>
    <h2 class="sec" style="margin-top:18px">Escolha seu clube</h2>
    <p class="dim">Você assume a gestão esportiva: escalação, táticas, treino, mercado, base e finanças. O circuito roda sozinho ao seu redor.</p>
    <div class="tabs" style="margin-top:14px">${REGIONS.map(r=>`<button data-rg="${r.id}" class="${escRegiao===r.id?'on':''}">${r.nome}</button>`).join('')}</div>
    <div class="tabs">${[[1,'Liga principal (Tier 1)'],[2,'Challengers (Tier 2) — modo difícil']].map(([k,n])=>`<button data-tr="${k}" class="${escTier===k?'on':''}">${n}</button>`).join('')}</div>
    <div class="card flat"><table><thead><tr><th>Equipe</th><th class="c">Prestígio</th><th class="c">Over</th><th class="r">Caixa</th><th class="r">Folha</th><th></th></tr></thead>
    <tbody>${times.map(id=>{const t=T(id);const ov=Math.round(t.titulares.reduce((s,i)=>s+over(P(i)),0)/5);
      const fo=t.elenco.reduce((s,i)=>s+P(i).salario,0);
      return `<tr><td><span class="linha-t">${escudo(t,24)}<b>${esc(t.nome)}</b> <span class="dim">${t.tag}</span></span></td><td class="c num">${Math.round(t.prestigio)}</td>
      <td class="c"><span class="ov ${ovClass(ov)}">${ov}</span></td><td class="r num">${money(t.caixa)}</td>
      <td class="r num">${money(fo)}</td><td class="r"><button class="btn sm" data-pick="${id}">Assumir</button></td></tr>`;}).join('')}
    </tbody></table></div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:flex-end">
      <span class="dim">Semente do mundo</span><input type="number" id="seedIn" value="${G?G.seed:12345}" style="width:120px">
      <button class="btn ghost" id="regen">Gerar outro mundo</button></div>
  </div></div>`;
  /* o nome digitado sobrevive a cada repintura da tela: sem isso, trocar de
     região no meio do preenchimento apagava o que a pessoa escreveu */
  const guardaNome=()=>{const el=$('#njNome');if(el)escNome=el.value;};
  const inNome=$('#njNome');
  if(inNome)inNome.oninput=guardaNome;
  $('#modal').querySelectorAll('[data-papel]').forEach(b=>b.onclick=()=>{
    guardaNome();escPapel=b.dataset.papel;telaNovoJogo();});
  $('#modal').querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{guardaNome();escRegiao=b.dataset.rg;telaNovoJogo();});
  $('#modal').querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{guardaNome();escTier=+b.dataset.tr;telaNovoJogo();});
  $('#regen').onclick=()=>{iniciarPreRun(parseInt($('#seedIn').value)||12345);$('#modal').innerHTML='';};
  $('#modal').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    guardaNome();
    G.meuTime=b.dataset.pick;
    G.iniciadaEm=Date.now();
    criarManager(escNome,escPapel);
    montarMetas();
    const eu=G.manager;
    noticia((souTreinador()?'👔 ':'🏛 ')+eu.nome+' assumiu como '+
            (souTreinador()?'treinador':'diretoria')+' do '+T(G.meuTime).nome+'.');
    if(souTreinador()&&eu.metas.length)
      noticia('🎯 Meta da diretoria para '+G.ano+': '+eu.metas[0].texto+'.');
    salvarRun(G.runNome);
    $('#modal').innerHTML='';
    tela='inicio';hist=['inicio'];histPos=0;
    entrarNoJogo();
    flash('Boa sorte no comando do '+T(G.meuTime).nome+'.');
  });
}

/* ============================================================
   BOOT e ações da topbar
   ============================================================ */
async function boot(){
  await Storage.iniciar();
  Prefs.iniciar();
  await Imgs.iniciar();
  Rostos.iniciar();
  await atualizarRuns();

  /* carrega a partida mais recente, inclusive em pré-run: o Banco de dados é
     o fluxo principal antes de assumir um clube e não pode ser descartado no
     reload. Mas o boot para no menu — quem decide entrar é você. */
  const salvas=listaRuns;
  let carregou=false;
  if(salvas.length)carregou=await carregarRun(salvas[0].id);
  if(!carregou||!G)iniciarPreRun(Math.floor(Math.random()*900000)+1000);

  modo='menu';telaMenu='menu';
  render();
  window.addEventListener('beforeunload',()=>{if(G)salvarRun(G.runNome);});
}

/* liga os botões da topbar; chamado a cada pintarTop() */
function ligarAcoesTopo(){
  const bs=$('#btnSave');
  if(bs)bs.onclick=async()=>{
    const ok=await salvarRun(G.runNome);
    await atualizarRuns();
    flash(ok?'Partida salva.':'Falha ao salvar — exporte o .json em Partidas salvas.');
  };
  const bn=$('#btnNext');
  if(bn)bn.onclick=()=>avancarComRitual(1);
  const bf=$('#btnFim');
  if(bf)bf.onclick=()=>avancarAteMeuJogo();
}

/* Avançar uma semana passando pelo ritual de antes da partida, quando há
   partida sua e a preferência está ligada: relatório de scouting e veto de
   mapas ANTES de a semana ser jogada. Sem isso, o veto continua automático e o
   botão faz o que sempre fez. */
function avancarComRitual(quantas){
  const comp=(Prefs.get('prePartida')&&typeof prePartidaDisponivel==='function')
    ?prePartidaDisponivel():null;
  if(!comp)return aplicarAvanco(avancar(),quantas||1);
  abrirPrePartida(comp,plano=>{
    const r=avancar(plano);
    /* Série já assistida ao vivo: não abre a transmissão de novo por cima. */
    if(plano&&plano.serieFeita)aplicarAvanco(Object.assign({},r,{minhaPartida:null}),quantas||1);
    else aplicarAvanco(r,quantas||1);
  });
}
/* resolve o que mostrar depois de avançar, respeitando as preferências */
function aplicarAvanco(r,quantas){
  if(!r)return;
  if(r.tipo==='rodada'){
    aba=0;
    if(r.minhaPartida&&Prefs.get('aoVivo'))partidaAoVivo(r.minhaPartida);
    else if(r.minhaPartida&&Prefs.get('modalPartida'))modalPartida(r.minhaPartida);
    else if(!r.minhaPartida&&Prefs.get('resumoRodada'))modalResumo(r);
    else render();
  }else render();
  /* Semana sem jogo não é erro nem tempo perdido, e o aviso diz isso — junto
     com o que ela serviu para adiantar. */
  if(r.tipo==='semana'&&quantas===1&&!r.encerrado)
    flash('Semana de treino — '+rotuloSemana(G.ano,r.semana)+'.');
  if(r.encerrado)flash(r.encerrado+' encerrado.');
  /* O veredito vem por último e por cima de tudo: é o desfecho da temporada, e
     abrir antes deixaria a tela do jogo já no ano seguinte por baixo. */
  if(G&&G.vereditoPendente){
    const v=G.vereditoPendente;G.vereditoPendente=null;
    modalVeredito(v);
  }
  if(Prefs.get('autosave'))salvarRun(G.runNome);
  if(modo==='jogo'&&!$('#modal').innerHTML){pintarTop();pintarSide();}
  if(quantas>1)flash(quantas+' rodadas resolvidas.');
}

/* pula as rodadas em que seu clube não joga, até o próximo compromisso dele
   ou até a virada de bloco — o que vier primeiro */
function avancarAteMeuJogo(){
  /* Se a próxima semana já tem jogo seu, o ritual abre AGORA: adiantar por
     cima do próprio compromisso seria pular o veto sem avisar. */
  const comp=(Prefs.get('prePartida')&&typeof prePartidaDisponivel==='function')
    ?prePartidaDisponivel():null;
  if(comp){avancarComRitual(1);return;}
  let n=0,r=null;
  while(n<SEMANAS_ANO){
    r=avancar();n++;
    if(!r||r.tipo==='fim')break;
    if(r.encerrado)break;                      /* torneio encerrou: pare e mostre */
    if(r.minhaPartida)break;                   /* seu clube jogou */
    if(G.vereditoPendente)break;
  }
  aplicarAvanco(r,n);
  if(n>1)flash(n+' semanas adiantadas.');
}

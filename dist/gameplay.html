/* Laboratório de gameplay — mesma cara do VCT Manager (tokens copiados de styles.css) */
:root{
  --bg:#0B1218; --panel:#16222E; --panel2:#1C2A38; --line:#22323F; --line2:#2E4250;
  --tx:#ECE8E1; --tx2:#A3B4C2; --dim:#8193A3;
  --red:#FF4655; --teal:#18E5B4; --ouro:#E2B45A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.04em;line-height:1}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
#gpTela{position:fixed;inset:0;display:block;width:100vw;height:100vh}
body.gp-jogando #gpTela{cursor:none}
.gp-dim{color:var(--dim)}
.gp-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);font-weight:600;margin-bottom:8px}

/* ---------- menu ---------- */
.gp-tela-cheia{position:fixed;inset:0;overflow:auto;z-index:5;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(255,70,85,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(24,229,180,.08),transparent 60%),var(--bg)}
.gp-vidro{background:rgba(6,10,14,.78);backdrop-filter:blur(3px);display:grid;place-items:center}
.gp-menu-in{max-width:1180px;margin:0 auto;padding:28px 24px 40px}
.gp-topo{display:flex;gap:22px;align-items:flex-start;margin-bottom:22px}
.gp-topo h1{font-size:48px;margin:2px 0 6px}
.gp-topo p{max-width:720px}
.gp-volta{color:var(--tx2);text-decoration:none;font-size:13px;border:1px solid var(--line2);padding:6px 10px;white-space:nowrap;margin-top:4px}
.gp-volta:hover{color:var(--tx);border-color:var(--tx2)}
.gp-sec{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.gp-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gp-cols .gp-sec{margin-bottom:0}
.gp-mapas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gp-mapa{position:relative;text-align:left;padding:10px 10px 10px 46px;background:var(--panel2);border:1px solid var(--line2);min-height:54px}
.gp-mapa i{position:absolute;left:10px;top:10px;width:26px;height:34px;background:linear-gradient(135deg,var(--c1) 0 55%,var(--c2) 55% 80%,var(--c3) 80%);clip-path:polygon(0 0,100% 0,100% 80%,80% 100%,0 100%)}
.gp-mapa b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:20px;font-weight:400;letter-spacing:.05em;line-height:1}
.gp-mapa span{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.gp-mapa.on,.gp-op.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#22222e}
.gp-mapa:hover,.gp-op:hover{border-color:var(--tx2)}
.gp-tema{margin-top:10px;font-size:13px}
.gp-ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gp-ops3{grid-template-columns:repeat(3,1fr)}
.gp-op{text-align:left;padding:9px 10px;background:var(--panel2);border:1px solid var(--line2)}
.gp-op b{display:block;font-size:13px}
.gp-op span{display:block;font-size:11px;color:var(--dim)}
.gp-sls{margin-top:14px;display:grid;gap:10px}
.gp-sl{display:grid;grid-template-columns:1fr 150px 30px;gap:10px;align-items:center;font-size:13px}
.gp-sl i{display:block;font-style:normal;font-size:11px;color:var(--dim)}
.gp-sl input{accent-color:var(--red)}
.gp-sl b{text-align:right}
.gp-teclas{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;display:grid;gap:6px}
kbd{display:inline-block;min-width:20px;padding:1px 5px;margin:0 2px;border:1px solid var(--line2);border-bottom-width:2px;background:var(--panel2);font-family:'JetBrains Mono',monospace;font-size:11px;text-align:center}
.gp-acoes{display:flex;gap:10px;justify-content:center;margin-top:20px}
.gp-jogar{background:var(--red);color:#fff;font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:.08em;padding:10px 46px;clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%)}
.gp-jogar:hover{filter:brightness(1.1)}
.gp-sec-bt{border:1px solid var(--line2);padding:10px 22px;color:var(--tx2)}
.gp-sec-bt:hover{color:var(--tx);border-color:var(--tx2)}

/* ---------- HUD ---------- */
#gpHud{position:fixed;inset:0;pointer-events:none;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.gp-placar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;background:rgba(10,16,22,.78);border:1px solid var(--line2)}
.gp-placar>span{display:grid;place-items:center;padding:6px 18px;font-size:26px}
.gp-pl-eu{color:var(--teal);border-right:1px solid var(--line2)}
.gp-pl-ele{color:var(--red);border-left:1px solid var(--line2)}
.gp-pl-ele i,.gp-pl-meio i{display:block;font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-family:'Inter',sans-serif}
.gp-pl-meio{min-width:150px;text-align:center}
.gp-pl-meio b{font-size:20px;font-weight:600}
.gp-area{position:absolute;top:16px;left:16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.gp-feed{position:absolute;top:14px;right:14px;display:grid;gap:4px;justify-items:end}
.gp-kf{display:flex;gap:8px;align-items:center;background:rgba(10,16,22,.78);padding:4px 10px;font-size:12px;border-left:2px solid var(--line2)}
.gp-kf span{color:var(--dim)}
.gp-kf.meu{border-left-color:var(--teal)}
.gp-kf.morri{border-left-color:var(--red)}
.gp-vida{position:absolute;left:18px;bottom:16px;display:flex;gap:16px;align-items:flex-end}
.gp-vida b{display:block;font-size:34px;line-height:1}
.gp-vida span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.gp-hp b{color:#fff}
.gp-esc b{color:#7fb6ff;font-size:24px}
.gp-modo{font-size:12px;color:var(--tx2);padding-bottom:4px}
.gp-modo em{color:var(--red);font-style:normal;font-weight:600}
.gp-arma{position:absolute;right:18px;bottom:16px;text-align:right}
.gp-arma-n{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.06em}
.gp-mun b{font-size:34px;line-height:1}
.gp-mun span{color:var(--dim);font-size:16px;margin-left:4px}
.gp-arma .gp-dim{font-size:11px}
.gp-faixa{position:absolute;top:22%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',Impact,sans-serif;font-size:46px;letter-spacing:.08em;opacity:0;transition:opacity .2s;color:#fff}
.gp-faixa.on{opacity:1}
.gp-faixa.ok{color:var(--teal)}
.gp-faixa.no{color:var(--red)}

/* ---------- pausa e fim ---------- */
.gp-fim-in{width:min(640px,92vw);background:var(--panel);border:1px solid var(--line2);padding:24px;text-align:center}
.gp-fim-in h2{font-size:52px;margin:6px 0 16px}
.gp-fim-in h2.ok{color:var(--teal)}
.gp-fim-in h2.no{color:var(--red)}
.gp-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.gp-nums div{background:var(--panel2);border:1px solid var(--line);padding:10px 4px}
.gp-nums b{display:block;font-size:20px}
.gp-nums span{font-size:11px;color:var(--dim)}
.gp-dicas{list-style:none;text-align:left;display:grid;gap:8px}
.gp-dicas li{background:var(--panel2);border-left:2px solid var(--ouro);padding:8px 12px;font-size:13px}
.gp-dicas b{color:var(--ouro)}

/* agentes */
.gp-pap{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.gp-pap-n{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;padding-top:12px}
.gp-ags{display:flex;flex-wrap:wrap;gap:6px}
.gp-ag{width:62px;padding:4px 2px 5px;background:var(--panel2);border:1px solid var(--line2);display:grid;justify-items:center;gap:3px}
.gp-ag b{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.gp-ag.img{border-color:rgba(24,229,180,.55)}
.gp-ag.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#22222e}
.gp-ag-r{width:40px;height:40px;object-fit:cover;background:#0f1923}
.gp-ini{display:grid;place-items:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;color:var(--tx2);letter-spacing:.04em}
.gp-nota{font-size:12px;margin:6px 0 10px}
.gp-rival{display:flex;gap:10px;align-items:center;font-size:13px}
.gp-rival select{background:var(--panel2);color:var(--tx);border:1px solid var(--line2);padding:6px 8px;font-family:inherit}
.gp-hud-r{width:52px;height:52px;object-fit:cover;border:1px solid var(--line2);background:#0f1923;align-self:center}
.gp-vida .gp-ini{font-size:22px}
.gp-arma-img{display:block;height:28px;max-width:170px;object-fit:contain;margin-left:auto;margin-bottom:2px;opacity:.95}
.gp-habs{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end}
.gp-hab{position:relative;width:42px;height:42px;background:rgba(10,16,22,.78);border:1px solid var(--line2);display:grid;place-items:center;opacity:.55}
.gp-hab img{width:30px;height:30px}
.gp-hab i{width:16px;height:16px;border:2px solid var(--line2);transform:rotate(45deg)}
.gp-hab kbd{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9px;padding:0 3px;min-width:0}
.gp-hab-nota{font-size:10px;color:var(--dim);margin-left:6px;align-self:center;max-width:90px;line-height:1.2}

@media (max-width:820px){
  .gp-cols{grid-template-columns:1fr}
  .gp-topo{flex-direction:column;gap:10px}
  .gp-ops3{grid-template-columns:1fr 1fr}
  .gp-sl{grid-template-columns:1fr 110px 28px}
  .gp-nums{grid-template-columns:repeat(3,1fr)}
}

/* ===== src/gameplay/grade.js ===== */
/* ============================================================
   GAMEPLAY · A GRADE DO MAPA
   O mapa vem de data/gameplay/mapas.js (extraído dos minimapas):
   células de CELULA metros, parede ou chão, com as áreas de planta.
   Tudo aqui trabalha em METROS; a célula é detalhe interno.
   Sem DOM: dá para rodar no node (tools/gameplay.mjs).
   Um único global, GP, para não trombar com o jogo de gestão.
   ============================================================ */
var GP = (typeof GP !== 'undefined' && GP) || {};

GP.SITIO_COD = {'.': 0, 'a': 1, 'b': 2, 'c': 3};

/* RLE → linha de texto */
GP._desfazRLE = function (s) {
  let out = '', num = '';
  for (const ch of s) {
    if (ch >= '0' && ch <= '9') { num += ch; continue; }
    out += ch.repeat(num ? +num : 1); num = '';
  }
  return out;
};

GP.carregarMapa = function (nome) {
  const d = MAPAS_GAMEPLAY[nome];
  if (!d) throw new Error('mapa de gameplay inexistente: ' + nome);
  const W = d.largura, H = d.altura, cel = d.celula_m;
  const solido = new Uint8Array(W * H), sitio = new Uint8Array(W * H);
  d.grade.forEach((lin, y) => {
    const t = GP._desfazRLE(lin);
    for (let x = 0; x < W; x++) {
      const ch = t[x] || '#';
      if (ch === '#') solido[y * W + x] = 1;
      else sitio[y * W + x] = GP.SITIO_COD[ch] || 0;
    }
  });
  const centro = c => ({x: (c[0] + 0.5) * cel, y: (c[1] + 0.5) * cel});
  const m = {
    nome, W, H, cel, solido, sitio,
    larguraM: W * cel, alturaM: H * cel,
    spawn: d.spawn ? {atk: centro(d.spawn.atk), def: centro(d.spawn.def)} : null,
    areas: (d.areas || []).map(a => ({nome: a.nome, ...centro(a.c)})),
    sitios: {},
  };
  /* centro de cada área de planta (para a IA e para o desenho da letra) */
  const soma = {};
  for (let i = 0; i < W * H; i++) if (sitio[i]) {
    const k = sitio[i], s = soma[k] || (soma[k] = {x: 0, y: 0, n: 0});
    s.x += i % W; s.y += (i / W) | 0; s.n++;
  }
  for (const k in soma) {
    const s = soma[k], letra = 'abc'[k - 1];
    m.sitios[letra] = {x: (s.x / s.n + 0.5) * cel, y: (s.y / s.n + 0.5) * cel, celulas: s.n};
  }
  GP._prepararNav(m);
  return m;
};

/* ---------- consultas básicas ---------- */
GP.celSolida = function (m, cx, cy) {
  if (cx < 0 || cy < 0 || cx >= m.W || cy >= m.H) return true;
  return m.solido[cy * m.W + cx] === 1;
};
GP.solidoEm = function (m, x, y) {
  return GP.celSolida(m, Math.floor(x / m.cel), Math.floor(y / m.cel));
};
GP.sitioEm = function (m, x, y) {
  const cx = Math.floor(x / m.cel), cy = Math.floor(y / m.cel);
  if (cx < 0 || cy < 0 || cx >= m.W || cy >= m.H) return '';
  const k = m.sitio[cy * m.W + cx];
  return k ? 'abc'[k - 1] : '';
};
/* o nome da área mais próxima com linha de visão (ou só a mais próxima) */
GP.areaEm = function (m, x, y) {
  let melhor = null, dm = 1e9;
  for (const a of m.areas) {
    if (!a.nome) continue;
    const d = Math.hypot(a.x - x, a.y - y) + (GP.linhaLivre(m, x, y, a.x, a.y) ? 0 : 12);
    if (d < dm) { dm = d; melhor = a; }
  }
  return melhor ? melhor.nome : '';
};

/* ---------- raio até a parede (DDA na grade) ----------
   devolve a distância em metros até a primeira célula sólida, até `max` */
GP.raio = function (m, x0, y0, ang, max) {
  const c = m.cel, dx = Math.cos(ang), dy = Math.sin(ang);
  let cx = Math.floor(x0 / c), cy = Math.floor(y0 / c);
  if (GP.celSolida(m, cx, cy)) return 0;
  const passoX = dx > 0 ? 1 : -1, passoY = dy > 0 ? 1 : -1;
  const tDx = dx !== 0 ? Math.abs(c / dx) : Infinity, tDy = dy !== 0 ? Math.abs(c / dy) : Infinity;
  let tX = dx !== 0 ? ((dx > 0 ? (cx + 1) * c - x0 : x0 - cx * c) / Math.abs(dx)) : Infinity;
  let tY = dy !== 0 ? ((dy > 0 ? (cy + 1) * c - y0 : y0 - cy * c) / Math.abs(dy)) : Infinity;
  let t = 0;
  while (t < max) {
    if (tX < tY) { t = tX; tX += tDx; cx += passoX; }
    else { t = tY; tY += tDy; cy += passoY; }
    if (GP.celSolida(m, cx, cy)) return Math.min(t, max);
  }
  return max;
};
GP.linhaLivre = function (m, x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  if (d < 1e-6) return true;
  return GP.raio(m, x0, y0, Math.atan2(y1 - y0, x1 - x0), d) >= d - 1e-6;
};

/* ---------- movimento com colisão (círculo contra a grade) ----------
   resolve um eixo de cada vez: escorrega na parede em vez de grudar */
GP.colide = function (m, x, y, r) {
  const c = m.cel;
  const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
  const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    if (!GP.celSolida(m, cx, cy)) continue;
    /* ponto da célula mais perto do centro */
    const px = Math.max(cx * c, Math.min(x, (cx + 1) * c));
    const py = Math.max(cy * c, Math.min(y, (cy + 1) * c));
    if ((px - x) * (px - x) + (py - y) * (py - y) < r * r) return true;
  }
  return false;
};
GP.mover = function (m, e, dx, dy) {
  const r = e.raio;
  /* passos curtos: nada atravessa parede fina em quadro lento */
  const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (m.cel * 0.45)));
  const sx = dx / n, sy = dy / n;
  let bateu = false;
  for (let i = 0; i < n; i++) {
    if (!GP.colide(m, e.x + sx, e.y, r)) e.x += sx; else bateu = true;
    if (!GP.colide(m, e.x, e.y + sy, r)) e.y += sy; else bateu = true;
  }
  return bateu;
};

/* ---------- navegação ----------
   A* numa grade de 1 m (2×2 células) com folga de parede, para a IA.
   Um bloco de navegação é livre se o corpo (raio ~0,4 m) cabe no centro dele. */
GP._prepararNav = function (m) {
  const f = 2, W = Math.ceil(m.W / f), H = Math.ceil(m.H / f), passo = m.cel * f;
  const livre = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)

/* ===== src/gameplay/motor.js ===== */
/* ============================================================
   GAMEPLAY · O MOTOR DA PARTIDA (visão de cima)
   Sem DOM. Cada quadro: os comandos (teclado ou IA) viram
   movimento, tiro, dano, som. Unidades: metros, segundos, graus

     reflexo     → tempo de reação do bot e a velocidade de virar

GP.ALCANCE_SOM = 15;        /* passos correndo se ouvem até aqui */

GP.parametros = function (a) {

    erroMult: 1.3 - 0.55 * mira,
    reacao: 0.46 - 0.26 * ref,             /* bot: do inimigo aparecer ao 1º tiro (s) */
    giro: 260 + 700 * ref,                 /* graus/s que o bot consegue virar */
    velMult: 0.96 + 0.08 * mov,
    acel: 26 + 26 * mov,                   /* m/s² para parar ou arrancar */
    fov: 360,                              /* sem cone: todo mundo enxerga em volta */
    periferia: 0.28 - 0.22 * vis,          /* bot: atraso extra se o alvo surge fora da frente dele */
    rajadaMult: 1.25 - 0.5 * clu,
    erroMira: 0.8 - 0.45 * mira,           /* bot: erro inicial (m) ao achar o alvo */
    erroPiso: 0.07 + 0.16 * (1 - mira),    /* bot: tremida que nunca some (menos tiro na cabeça) */
    ajuste: 0.75 - 0.4 * mira,             /* bot: tempo para corrigir a mira (s) */
    disciplina: 0.35 + 0.6 * clu,          /* bot: quanto segura a rajada */
    contraStrafe: 0.35 + 0.6 * mov,        /* bot: chance de parar antes de atirar */

  if (e.spray > Ad.erro.max * 0.6) e.st.tirosAbertos = (e.st.tirosAbertos || 0) + 1;
  J.tiros.push({x0: ox, y0: oy, x1: ox + dx * tAlvo, y1: oy + dy * tAlvo, t: J.t, dono: e.id, time: e.time, acertou: !!alvo});
  J.eventos.push({tipo: 'tiro', t: J.t, dono: e.id, x: e.x, y: e.y});
  /* tiro faz barulho longe */
  J.sons.push({x: e.x, y: e.y, t: J.t, dono: e.id, time: e.time, r: 45, tiro: true});
  if (!alvo) { J.marcas.push({x: ox + dx * tAlvo, y: oy + dy * tAlvo, t: J.t, tipo: 'parede'}); return; }
  const parte = pAlvo < GP.ZONA_CABECA ? 0 : pAlvo < GP.ZONA_CORPO ? 1 : 2;
  const dano = GP.danoArma(Ad, tAlvo, parte);
  GP._dano(J, e, alvo, dano, parte, Ad);
};

GP._dano = function (J, de, alvo, dano, parte, Ad) {
  /* o escudo segura 2/3 do dano enquanto durar */
  const antes = alvo.hp + alvo.escudo;
  const absorve = Math.min(alvo.escudo, dano * 0.66);
  alvo.escudo -= absorve;
  alvo.hp -= dano - absorve;
  de.st.acertos++; if (parte === 0) de.st.cabecas++;
  de.st.dano += Math.round(Math.min(dano, antes));
  J.marcas.push({x: alvo.x, y: alvo.y, t: J.t, tipo: 'acerto', parte, dano: Math.round(dano), de: de.id, em: alvo.id});
  if (alvo.bot && alvo.ia) { alvo.ia.ouviu = {x: de.x, y: de.y, t: J.t}; }
  if (alvo.hp <= 0) {
    alvo.hp = 0; alvo.vivo = false; alvo.st.mortes++; de.st.kills++; alvo._morreuEm = J.t;
    J.eventos.push({tipo: 'morte', t: J.t, de: de.id, em: alvo.id, arma: Ad.nome, cabeca: parte === 0});
  }
};

/* ============================================================
   A IA DO DUELO
   Patrulha → escuta → vê → reage (tempo de reação do atributo) →
   para (se for disciplinado) → atira com a mira se corrigindo.
   ============================================================ */
GP._inimigos = (J, e) => J.ents.filter(o => o.vivo && o.time !== e.time);

GP.iaPensar = function (J, e, dt) {
  const ia = e.ia, c = e.cmd, rnd = J.rnd, p = e.p;
  if (J.round.fase !== 'ativo') { c.mx = c.my = 0; c.atirar = false; return; }
  /* percepção */
  let alvo = null, dAlvo = 1e9;
  for (const o of GP._inimigos(J, e)) {
    if (!GP.ve(J, e, o)) continue;
    const d = Math.hypot(o.x - e.x, o.y - e.y);
    if (d < dAlvo) { alvo = o; dAlvo = d; }
  }
  for (const s of J.sons) {
    if (s.time === e.time || J.t - s.t > dt * 1.5) continue;
    const d = Math.hypot(s.x - e.x, s.y - e.y);
    if (d < s.r) ia.ouviu = {x: s.x + GP._gauss(rnd) * (s.tiro ? 1.5 : 2.5), y: s.y + GP._gauss(rnd) * (s.tiro ? 1.5 : 2.5), t: J.t};
  }
  if (alvo) {
    const novo = !ia.vista || J.t - ia.vista.t > 0.7 || ia.vista.id !== alvo.id;
    if (novo) {
      /* achou agora: reação + erro de mira inicial (maior longe e se o alvo corre) */
      const var_ = 1 + GP._gauss(rnd) * p.variacao;
      /* aparecer pelas costas ou pelo lado demora mais para perceber */
      const fora = Math.abs(GP.angDif(e.ang, Math.atan2(alvo.y - e.y, alvo.x - e.x))) > 0.6;
      ia.reacaoAte = J.t + Math.max(0.12, p.reacao * var_ * (0.9 + 0.2 * rnd())) + (fora ? p.periferia : 0);
      const mag = p.erroMira * (0.6 + dAlvo / 30) * Math.max(0.5, var_);
      const a = rnd() * Math.PI * 2;
      ia.errX = Math.cos(a) * mag; ia.errY = Math.sin(a) * mag;
      ia.rajada = 0;
    }
    ia.vista = {id: alvo.id, x: alvo.x, y: alvo.y, t: J.t};
    ia.estado = 'combate';
  } else if (ia.vista && J.t - ia.vista.t < 4) ia.estado = 'cacar';
  else if (ia.ouviu && J.t - ia.ouviu.t < 5) ia.estado = 'alerta';
  else ia.estado = 'patrulha';

  c.atirar = false;
  c.luneta = false;
  const A = GP.defArma(e), arm = GP.armaDe(e);
  /* sem bala e sem inimigo à vista: recarrega */
  if (!alvo && arm.municao < GP.ARMAS[arm.id].pente * 0.5 && arm.reserva > 0) c.recarregar = true;
  if (arm.municao === 0 && arm.reserva === 0 && e.armas.secundaria && e.slot !== 'secundaria') c.trocar = 'secundaria';

  if (ia.estado === 'combate') {
    /* mira: o erro some aos poucos (o tempo de ajuste vem da mira) */
    const k = Math.exp(-dt / Math.max(0.05, p.ajuste));
    ia.errX *= k; ia.errY *= k;
    /* alvo andando pesa: o bot mira um pouco atrás */
    const lead = 0.12 * (1 - GP._q(e.atrib.mira));
    const sem = (e.id.length * 1.7) % 6.28, tr = p.erroPiso;
    const ax = alvo.x - alvo.vx * lead + ia.errX + Math.cos(J.t * 5.3 + sem) * tr, ay = alvo.y - alvo.vy * lead + ia.errY + Math.sin(J.t * 4.1 + sem * 2) * tr;
    GP._virarPara(e, Math.atan2(ay - e.y, ax - e.x), p.giro, dt);
    const mira = Math.abs(GP.angDif(e.ang, Math.atan2(ay - e.y, ax - e.x)));
    const podeAtirar = J.t >= ia.reacaoAte && mira < 0.12;
    /* movimento: para para atirar, ou faz o "AD" entre rajadas */
    const parado = rnd() < p.contraStrafe;
    if (podeAtirar) {
      if (J.t < ia.pausaAte) {
        GP._strafe(J, e, dt, alvo);
      } else {
        c.mx = parado ? 0 : c.mx * 0.5; c.my = parado ? 0 : c.my * 0.5; c.modo = 'anda';
        const vel = Math.hypot(e.vx, e.vy);
        const pronto = vel < 1.2 || rnd() > p.contraStrafe;   /* o disciplinado espera parar */
        /* longe, ou rajada já aberta: dá tiro a tiro */
        const limiteRajada = (dAlvo > 22 ? 0.7 : 1.8) / Math.max(0.3, p.disciplina) * (A.tipo === 'smg' ? 1.6 : 1);
        if (pronto && e.spray <= limiteRajada) { c.atirar = true; ia.rajada++; }
        if (ia.rajada >= (dAlvo > 22 ? 2 : 4 + Math.floor(rnd() * 4))) {
          ia.rajada = 0; ia.pausaAte = J.t + 0.18 + rnd() * 0.25; ia.strafe = rnd() < 0.5 ? -1 : 1;
        }
      }
    } else {
      c.mx = 0; c.my = 0; c.modo = 'anda';
    }
    if (A.luneta && J.t >= ia.reacaoAte - 0.15) c.luneta = true;
    ia.caminho = null;
    return;
  }
  /* sem alvo à vista */
  let destino = null, modo = 'corre';
  if (ia.estado === 'cacar') { destino = ia.vista; modo = 'anda'; }
  else if (ia.estado === 'alerta') {
    /* ouviu: o agressivo vai atrás andando, o cauteloso segura o ângulo */
    if (ia.agressivo > 0.45 || J.t > ia.seguraAte + 6) { destino = ia.ouviu; modo = 'anda'; }
    else {
      if (J.t > ia.seguraAte) ia.seguraAte = J.t + 2.5 + rnd() * 3;
      GP._virarPara(e, Math.atan2(ia.ouviu.y - e.y, ia.ouviu.x - e.x), p.giro * 0.5, dt);
      c.mx = c.my = 0; c.modo = 'agacha';
      return;
    }
  } else {
    if (!ia.alvoPonto || Math.hypot(ia.alvoPonto.x - e.x, ia.alvoPonto.y - e.y) < 2.5 || J.t > ia.repensa) {
      ia.alvoPonto = GP._pontoDePatrulha(J, e); ia.caminho = null; ia.repensa = J.t + 18;
    }
    destino = ia.alvoPonto;
    /* perto de onde costuma ter briga, anda em silêncio */
    modo = J.t % 9 < 3 && ia.agressivo < 0.7 ? 'anda' : 'corre';
  }
  GP._irPara(J, e, destino, modo, dt);
};

GP._virarPara = function (e, ang, giroGraus, dt) {
  const d = GP.angDif(e.ang, ang), max = giroGraus * Math.PI / 180 * dt;
  e.ang += Math.abs(d) <= max ? d : Math.sign(d) * max;
};
GP._strafe = function (J, e, dt, alvo) {
  const a = Math.atan2(alvo.y - e.y, alvo.x - e.x) + Math.PI / 2 * e.ia.strafe;
  e.cmd.mx = Math.cos(a); e.cmd.my = Math.sin(a); e.cmd.modo = 'corre';
};
GP._irPara = function (J, e, alvo, modo, dt) {
  const ia = e.ia, c = e.cmd;
  if (!alvo) { c.mx = c.my = 0; return; }
  if (!ia.caminho || !ia.caminho.length || ia.caminhoPara !== alvo || J.t > ia.caminhoAte) {
    ia.caminho = GP.caminho(J.m, e.x, e.y, alvo.x, alvo.y) || [];
    ia.caminhoPara = alvo; ia.caminhoAte = J.t + 2.5;
  }
  while (ia.caminho.length && Math.hypot(ia.caminho[0].x - e.x, ia.caminho[0].y - e.y) < 0.7) ia.caminho.shift();
  const prox = ia.caminho[0];
  if (!prox) { c.mx = c.my = 0; return; }
  const dx = prox.x - e.x, dy = prox.y - e.y, d = Math.hypot(dx, dy);
  c.mx = dx / d; c.my = dy / d; c.modo = modo;
  /* olha para onde vai, com um pouco de antecipação de esquina */
  const olhar = ia.caminho[1] && d < 3 ? Math.atan2(ia.caminho[1].y - e.y, ia.caminho[1].x - e.x) : Math.atan2(dy, dx);
  GP._virarPara(e, olhar, e.p.giro * 0.6, dt);
  /* travou numa quina: refaz o caminho */
  if (Math.hypot(e.vx, e.vy) < 0.3) { ia.travado += dt; if (ia.travado > 0.6) { ia.caminho = null; ia.travado = 0; } }
  else ia.travado = 0;
};
GP._pontoDePatrulha = function (J, e) {
  const m = J.m, ini = GP._inimigos(J, e);
  /* no duelo, a IA tende a ir para onde o rival está (sem saber exatamente):
     uma área perto dele, ou um bomb */
  const cands = m.areas.length ? m.areas : [GP.pontoLivre(m, J.rnd)];
  if (ini.length && J.rnd() < 0.55) {
    const o = ini[0];
    const perto = cands.slice().sort((a, b) => Math.hypot(a.x - o.x, a.y - o.y) - Math.hypot(b.x - o.x, b.y - o.y));
    return perto[Math.floor(J.rnd() * Math.min(4, perto.length))];
  }
  return cands[Math.floor(J.rnd() * cands.length)];
};

/* ============================================================
   MODOS
   duelo  — 1 contra 1, round a round, primeiro a N
   alvos  — treino: bots que só andam; 60 s, conta abates
   ============================================================ */
GP.montarDuelo = function (o) {
  const J = GP.novoJogo(o);
  const eu = GP.criarAgente({id: 'eu', nome: o.nome || 'Você', time: 'eu', atrib: o.atribEu, agente: o.agenteEu,
    primaria: o.arma === 'classic' ? null : o.arma, secundaria: 'classic', escudo: o.escudo || 'pesado'});
  const n = o.modo === 'alvos' ? 4 : 1;
  for (let i = 0; i < n; i++) {
    J.ents.push(GP.criarAgente({id: 'bot' + i, nome: o.nomesBot ? o.nomesBot[i] : 'Bot ' + (i + 1), time: 'eles', bot: true,
      passivo: o.modo === 'alvos', atrib: o.atribBot, primaria: o.armaBot || o.arma, secundaria: 'classic',
      agente: o.agentesBot ? o.agentesBot[i % o.agentesBot.length] : null,
      escudo: o.modo === 'alvos' ? 'nenhum' : (o.escudo || 'pesado'), agressivo: o.agressivo}));
  }
  J.ents.unshift(eu);
  J.eu = eu;
  J.placar = {eu: 0, eles: 0};
  J.alvoRounds = o.rounds || 7;
  J.duracaoRound = o.modo === 'alvos' ? 60 : 100;
  GP.novoRound(J);
  return J;
};

GP._posicoesDoRound = function (J) {
  const m = J.m, rnd = J.rnd, o = J.opc;
  if (o.spawns === 'oficiais' && m.spawn) {
    const lado = J.round.n % 2 === 1 ? ['atk', 'def'] : ['def', 'atk'];
    return [m.spawn[lado[0]], m.spawn[lado[1]]];
  }
  /* duelo rápido: dois pontos a 22–45 m de caminho, sem se ver */
  for (let t = 0; t < 300; t++) {
    const a = m.areas.length ? m.areas[Math.floor(rnd() * m.areas.length)] : GP.pontoLivre(m, rnd);
    const b = m.areas.length ? m.areas[Math.floor(rnd() * m.areas.length)] : GP.pontoLivre(m, rnd);
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 20 || d > 42 || GP.linhaLivre(m, a.x, a.y, b.x, b.y)) continue;
    const cam = GP.caminho(m, a.x, a.y, b.x, b.y);
    if (!cam) continue;
    return [a, b];
  }
  return [GP.pontoLivre(m, rnd), GP.pontoLivre(m, rnd)];
};

GP.novoRound = function (J) {
  J.round.n++;
  J.round.fase = 'pre'; J.round.ate = J.t + (J.round.n === 1 ? 1.5 : 2.2); J.round.vencedor = null;
  J.tiros = []; J.sons = []; J.marcas = [];
  const [pe, pb] = GP._posicoesDoRound(J);
  const pos = (e, p) => {
    const q = GP.navLivre(J.m, p.x, p.y) ? p : (() => { const i = GP._navPerto(J.m, p.x, p.y), n = J.m.nav; return {x: (i % n.W + 0.5) * n.passo, y: (((i / n.W) | 0) + 0.5) * n.passo}; })();
    e.x = q.x; e.y = q.y; e.vx = e.vy = 0;
  };
  const bots = J.ents.filter(e => e.bot);
  pos(J.eu, pe);
  bots.forEach((b, i) => {
    if (J.modo === 'alvos') {
      /* os alvos nascem à vista, a 8–25 m */
      for (let t = 0; t < 400; t++) {
        const p = GP.pontoLivre(J.m, J.rnd), d = Math.hypot(p.x - J.eu.x, p.y - J.eu.y);
        if (d > 8 && d < 25 && GP.linhaLivre(J.m, J.eu.x, J.eu.y, p.x, p.y)) { pos(b, p); break; }
        if (t === 399) pos(b, p);
      }
    } else pos(b, i ? GP.pontoLivre(J.m, J.rnd) : pb);
  });
  for (const e of J.ents) {
    e.hp = 100; e.vivo = true; e.spray = 0; e.recarregaAte = 0; e.equipaAte = 0; e._viuEm = 0; e._reagiu = false; e._susto = null; e._morreuEm = 0;
    e.escudo = GP.ESCUDOS[e.passivo ? 'nenhum' : (J.opc.escudo || 'pesado')];
    for (const s of ['primaria', 'secundaria']) if (e.armas[s]) {
      const A = GP.ARMAS[e.armas[s].id]; e.armas[s].municao = A.pente; e.armas[s].reserva = A.reserva;
    }
    e.slot = e.armas.primaria ? 'primaria' : 'secundaria';
    /* cada um começa olhando para o outro lado do mapa, para o centro */
    e.ang = Math.atan2(J.m.alturaM / 2 - e.y, J.m.larguraM / 2 - e.x);
    if (e.ia) Object.assign(e.ia, {estado: 'patrulha', caminho: null, alvoPonto: null, vista: null, ouviu: null, seguraAte: 0, pausaAte: 0});
  }
  J.eu.cmd.ang = J.eu.ang;
};

GP._fluxoDoRound = function (J) {
  const R = J.round;
  if (J.fim) return;
  if (R.fase === 'pre' && J.t >= R.ate) { R.fase = 'ativo'; R.ate = J.t + J.duracaoRound; R.inicio = J.t; }
  if (R.fase === 'ativo') {
    if (J.modo === 'alvos') {
      /* treino: alvo abatido volta em outro lugar */
      for (const b of J.ents) if (b.bot && !b.vivo && J.t - (b._morreuEm || (b._morreuEm = J.t)) > 0.6) {
        for (let t = 0; t < 400; t++) {
          const p = GP.pontoLivre(J.m, J.rnd), d = Math.hypot(p.x - J.eu.x, p.y - J.eu.y);
          if (d > 7 && d < 26 && GP.linhaLivre(J.m, J.eu.x, J.eu.y, p.x, p.y) || t === 399) { b.x = p.x; b.y = p.y; break; }
        }
        b.vivo = true; b.hp = 100; b._morreuEm = 0;
      }
      if (J.t >= R.ate) { R.fase = 'fim'; J.fim = {modo: 'alvos'}; }
      return;
    }
    const euVivo = J.eu.vivo, eles = J.ents.filter(e => e.time === 'eles' && e.vivo).length;
    let venc = null;
    if (!euVivo) venc = 'eles'; else if (!eles) venc = 'eu'; else if (J.t >= R.ate) venc = 'empate';
    if (venc) {
      R.fase = 'fim'; R.vencedor = venc; R.ate = J.t + 2.6;
      if (venc !== 'empate') J.placar[venc]++;
      J.eventos.push({tipo: 'round', t: J.t, vencedor: venc, n: R.n});
    }
  } else if (R.fase === 'fim' && J.t >= R.ate) {
    if (J.placar.eu >= J.alvoRounds || J.placar.eles >= J.alvoRounds) J.fim = {modo: 'duelo', venceu: J.placar.eu > J.placar.eles};
    else GP.novoRound(J);
  }
};

/* o que o jogador vê agora (para desenhar e para medir a reação) */
GP.atualizarVisaoDoJogador = function (J) {
  const eu = J.eu;
  let viu = false;
  for (const o of J.ents) {
    if (o === eu) continue;
    o._visivel = GP.ve(J, eu, o);
    if (o._visivel) { o._vistoEm = J.t; o._vistoX = o.x; o._vistoY = o.y; viu = true; }
  }
  if (viu && !eu._viuEm) { eu._viuEm = J.t; eu._reagiu = false; eu._susto = {ini: J.t, dur: 0.25, forca: 1.6 * (1 - GP._q(eu.atrib.reflexo))}; }
  if (!viu && eu._viuEm && J.t - eu._viuEm > 1.5) eu._viuEm = 0;
};

/* resumo para o relatório do fim */
GP.resumo = function (J) {
  const e = J.eu.st;
  const reac = e.reacoes.length ? e.reacoes.reduce((a, b) => a + b, 0) / e.reacoes.length : null;
  return {
    kills: e.kills, mortes: e.mortes, tiros: e.tiros, acertos: e.acertos,
    precisao: e.tiros ? Math.round(e.acertos / e.tiros * 100) : 0,
    hs: e.acertos ? Math.round(e.cabecas / e.acertos * 100) : 0,
    dano: e.dano, reacaoMs: reac != null ? Math.round(reac * 1000) : null,
    correndo: e.tiros ? Math.round((e.tirosCorrendo || 0) / e.tiros * 100) : 0,
    abertos: e.tiros ? Math.round((e.tirosAbertos || 0) / e.tiros * 100) : 0,
    rounds: J.round.n,
  };
};

  ['controlador', 'brimstone:Brimstone viper:Viper omen:Omen astra:Astra harbor:Harbor clove:Clove miks:Miks'],

  let im = GP.IMG.cache[src];
  if (!im) { im = GP.IMG.cache[src] = new Image(); im.src = src; }

GP.temImagem = (grupo, id, peca) => {

GP.agenteImg = (id, peca) => ((GP.manifesto().agentes || {})[id] || {})[peca] || null;
/* pré-carrega tudo de um agente (para não piscar no primeiro quadro) */

/* qual quadro mostrar agora (não muda o estado: só lê) */
GP.quadroDoAgente = function (o, t) {

  const vel = Math.hypot(o.vx, o.vy);
  if (vel < 0.6) return 'parado';

/* O boneco é desenhado em pé (vista de cima inclinada), não girado: altura

/* ===== src/gameplay/render.js ===== */
/* ============================================================

   O mapa é desenhado uma vez numa tela grande (fora da vista) e
   recortado pela câmera a cada quadro. Por cima: sons, tiros,

GP.PX_M = 16;            /* resolução da tela do mapa: pixels por metro */

/* tamanho de uma repetição da textura, em metros */

/* Os blocos de parede soltos no meio do chão (as caixas do minimapa) viram

    while (fila.length) {

    if (longo > 3.2 || razao > 1.6 || n < 0.7 * (x1 - x0 + 1) * (y1 - y0 + 1)) continue;

GP.desenharMapa = function (m) {
  const tema = GP.TEMAS[m.nome] || GP.TEMAS.ascent;
  const {W, H} = m, S = GP.PX_M, c = m.cel;
  const [c1, c2, pa, to, fu, si] = [tema.chao, tema.chao2, tema.parede, tema.topo, tema.fundo, tema.sitio].map(GP._hex);

  const sol = new Float32Array(W * H), dist = new Float32Array(W * H), sit = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) { sol[i] = m.solido[i]; sit[i] = m.sitio[i] ? 1 : 0; dist[i] = m.solido[i] ? 99 : 0; }
  for (let passo = 0; passo < 8; passo++) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!m.solido[i]) continue;
    let d = dist[i];
    if (x > 0) d = Math.min(d, dist[i - 1] + 1); if (x < W - 1) d = Math.min(d, dist[i + 1] + 1);
    if (y > 0) d = Math.min(d, dist[i - W] + 1); if (y < H - 1) d = Math.min(d, dist[i + W] + 1);
    dist[i] = d;

  const bil = (f, u, v) => {

    return (at(x0, y0) * (1 - fx) + at(x0 + 1, y0) * fx) * (1 - fy) + (at(x0, y0 + 1) * (1 - fx) + at(x0 + 1, y0 + 1) * fx) * fy;
  };

  const TW = tela.width = Math.round(W * c * S), TH = tela.height = Math.round(H * c * S);
  const g = tela.getContext('2d'), img = g.createImageData(TW, TH), d = img.data;

     A imagem é só desenhada (nunca lida de volta): funciona em file://. */
  const tx = GP.texturasDoMapa(m.nome);
  const ov = tx ? g.createImageData(TW, TH) : null, od = ov && ov.data;
  const mk = tx ? g.createImageData(TW, TH) : null, md = mk && mk.data;
  const kc = 1 / (c * S);
  /* A parede tem altura: vista de cima e um pouco de frente, cada parede
     mostra a FACE (o lado virado para baixo da tela, PAREDE_FACE_M de altura
     aparente) e o TOPO escuro; longe do piso vira o vazio. Tudo dentro da
     célula de parede: o desenho não invade o chão em que se anda. */

        if (face <= 0.25) { r *= 0.8; gg *= 0.8; b *= 0.8; }   /* rodapé */
        if (ov) { md[o + 3] = 255; od[o + 3] = Math.round(255 * (0.62 - 0.5 * face)); }

        r = to[0] * 1.15; gg = to[1] * 1.15; b = to[2] * 1.15;
        if (ov) { od[o] = r; od[o + 1] = gg; od[o + 2] = b; od[o + 3] = 255; }

        if (ov) { od[o] = r; od[o + 1] = gg; od[o + 2] = b; od[o + 3] = 255; }

      let k = 0.97 + 0.07 * GP._hash(tx2, ty2) + 0.025 * (GP._hash(Math.floor(wx * 2), Math.floor(wy * 2)) - 0.5);
      const jx = wx - tx2 * 2, jy = wy - ty2 * 2;
      if (jx < 0.07 || jy < 0.07) k *= 0.9;

      if (ov) { od[o + 3] = Math.round(255 * (1 - (1 - 0.12) * (1 - ao * 1.2) * (1 - sombra * 1.3))); }

        if (ov) { const a0 = od[o + 3] / 255, a2 = a * 0.8, at = a0 + a2 * (1 - a0);

        if (st > 0.3 && st < 0.7 && ((wx + wy) * 1.6 % 1) < 0.55) {
          r = si[0]; gg = si[1]; b = si[2];
          if (ov) { od[o] = si[0]; od[o + 1] = si[1]; od[o + 2] = si[2]; od[o + 3] = 230; }

       a nossa camada (topo escuro, vazio, sombras, bomb) */
    const camada = dados => { const cv = document.createElement('canvas'); cv.width = TW; cv.height = TH; cv.getContext('2d').putImageData(dados, 0, 0); return cv; };
    const padrao = (im, metros) => { const p = g.createPattern(im, 'repeat'); const k = metros * S / im.width; p.setTransform(new DOMMatrix([k, 0, 0, k, 0, 0])); return p; };

  const mini = document.createElement('canvas'); mini.width = W; mini.height = H;

    mi.data[i * 4] = cor[0]; mi.data[i * 4 + 1] = cor[1]; mi.data[i * 4 + 2] = cor[2]; mi.data[i * 4 + 3] = 255;

  mg.putImageData(mi, 0, 0);

  for (const L in m.sitios) {
    const st = m.sitios[L];

    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = tema.sitio; g.globalAlpha = 0.22;

  if (m.spawn) for (const [lado, cor] of [['atk', '#ff4655'], ['def', '#18e5b4']]) {
    const p = m.spawn[lado], gr = g.createRadialGradient(p.x * S, p.y * S, 0, p.x * S, p.y * S, 7 * S);

/* ---------- visão: o polígono do que o cone enxerga ---------- */
GP.poligonoVisao = function (J, e, alcance) {
  const m = J.m, fov = e.p.fov * Math.PI / 180, pts = [];
  const passo = 0.35 * Math.PI / 180;
  const a0 = e.ang - fov / 2, n = Math.ceil(fov / passo);
  pts.push([e.x, e.y]);
  for (let i = 0; i <= n; i++) {
    const a = a0 + i * fov / n, d = GP.raio(m, e.x, e.y, a, alcance);
    pts.push([e.x + Math.cos(a) * d, e.y + Math.sin(a) * d]);
  }
  return pts;
};

/* ---------- o quadro ---------- */
GP.render = function (R, J, cam, ui) {

  const eu = J.eu, tema = R.arte.tema;
  const W2S = (x, y) => [(x - cam.x) * esc + Wc / 2, (y - cam.y) * esc + Hc / 2];
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = tema.fundo; g.fillRect(0, 0, Wc, Hc);

  g.imageSmoothingEnabled = true;
  g.drawImage(R.arte.tela, sx, sy, vw * S, vh * S, 0, 0, Wc, Hc);
  g.imageSmoothingEnabled = true;

  /* sons que você ouve (passos e tiros de quem você não vê) */
  for (const s of J.sons) {
    if (s.time === eu.time) continue;
    const dono = J.ents.find(o => o.id === s.dono);
    if (dono && dono._visivel) continue;
    const d = Math.hypot(s.x - eu.x, s.y - eu.y);
    if (d > s.r) continue;
    const idade = (J.t - s.t) / 1.2, j = GP._hash(Math.round(s.t * 100), 7) * 2 - 1, j2 = GP._hash(7, Math.round(s.t * 100)) * 2 - 1;
    const erro = s.tiro ? 1.2 : 2.2;
    g.strokeStyle = s.tiro ? `rgba(255,200,120,${0.75 * (1 - idade)})` : `rgba(255,90,100,${0.6 * (1 - idade)})`;
    g.lineWidth = 0.12;
    g.beginPath(); g.arc(s.x + j * erro, s.y + j2 * erro, 0.4 + idade * (s.tiro ? 3.2 : 2.2), 0, Math.PI * 2); g.stroke();
  }
  /* rastros dos tiros */
  for (const t of J.tiros) {
    const vis = t.dono === eu.id || (J.ents.find(o => o.id === t.dono) || {})._visivel;
    if (!vis) continue;
    const a = 1 - (J.t - t.t) / 0.25;
    g.strokeStyle = t.time === eu.time ? `rgba(255,236,170,${0.85 * a})` : `rgba(255,120,120,${0.85 * a})`;
    g.lineWidth = 0.06;
    g.beginPath(); g.moveTo(t.x0, t.y0); g.lineTo(t.x1, t.y1); g.stroke();
    if (J.t - t.t < 0.05) { g.fillStyle = 'rgba(255,230,160,.9)'; g.beginPath(); g.arc(t.x0, t.y0, 0.22, 0, Math.PI * 2); g.fill(); }
  }
  for (const k of J.marcas) if (k.tipo === 'parede') {
    const a = 1 - (J.t - k.t) / 0.9;
    g.fillStyle = `rgba(230,220,200,${0.6 * a})`;
    g.beginPath(); g.arc(k.x, k.y, 0.1 + (1 - a) * 0.25, 0, Math.PI * 2); g.fill();
  }
  /* agentes */
  /* quem está de pé é desenhado de cima para baixo (quem está mais embaixo
     na tela fica na frente) */
  const vivos = J.ents.filter(o => o.vivo && (o === eu || o._visivel)).sort((a, b) => a.y - b.y);
  for (const o of J.ents) {
    if (o === eu) continue;
    if (o.vivo && o._visivel) continue;
    else if (o.vivo && o._vistoEm && J.t - o._vistoEm < 1.1) {
      /* último lugar em que você o viu */
      g.globalAlpha = 0.35 * (1 - (J.t - o._vistoEm) / 1.1);
      g.strokeStyle = '#ff4655'; g.lineWidth = 0.08; g.setLineDash([0.2, 0.15]);
      g.beginPath(); g.arc(o._vistoX, o._vistoY, o.raio, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      g.globalAlpha = 1;
    } else if (!o.vivo && o._morreuEm && J.t - o._morreuEm < 4 && GP.linhaLivre(J.m, eu.x, eu.y, o.x, o.y)) GP._corpo(g, o, J.t);
  }
  if (!eu.vivo) GP._corpo(g, eu, J.t);
  for (const o of vivos) GP._agente(g, o, o === eu ? '#18e5b4' : '#ff4655', 1, J.t);

  /* números de dano e marcas de acerto (por cima da névoa) */
  for (const k of J.marcas) if (k.tipo === 'acerto' && (k.de === eu.id || k.em === eu.id)) {
    const a = 1 - (J.t - k.t) / 0.9;
    g.save(); g.globalAlpha = a;
    g.font = `700 ${k.parte === 0 ? 0.9 : 0.7}px Inter, sans-serif`; g.textAlign = 'center';
    g.fillStyle = k.em === eu.id ? '#ff4655' : k.parte === 0 ? '#ffd166' : '#ffffff';
    g.fillText(String(k.dano), k.x + 0.6, k.y - 0.7 - (1 - a) * 0.8);
    g.restore();
  }
  /* indicador de inimigo visto fora da tela */
  g.setTransform(1, 0, 0, 1, 0, 0);
  for (const o of J.ents) {
    if (o === eu || !o.vivo || !o._visivel) continue;
    const [px, py] = W2S(o.x, o.y);
    if (px > 0 && py > 0 && px < Wc && py < Hc) continue;
    /* seta na borda da tela, na direção dele */
    const a = Math.atan2(py - Hc / 2, px - Wc / 2), m = 34 * R.dpr;
    const kx = (Wc / 2 - m) / Math.max(1e-6, Math.abs(Math.cos(a))), ky = (Hc / 2 - m) / Math.max(1e-6, Math.abs(Math.sin(a)));
    const r = Math.min(kx, ky);
    const x = Wc / 2 + Math.cos(a) * r, y = Hc / 2 + Math.sin(a) * r;
    g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = '#ff4655';
    g.beginPath(); g.moveTo(14 * R.dpr, 0); g.lineTo(-8 * R.dpr, 9 * R.dpr); g.lineTo(-8 * R.dpr, -9 * R.dpr); g.closePath(); g.fill(); g.restore();
  }
  /* mira com o círculo do erro atual */
  if (eu.vivo && ui.mouse) {
    const mx = ui.mouse.x * R.dpr, my = ui.mouse.y * R.dpr;
    const [ex, ey] = W2S(eu.x, eu.y);
    const dist = Math.hypot(mx - ex, my - ey);
    const erro = GP.erroAtual(eu, J.t) * Math.PI / 180;
    const r = Math.max(5 * R.dpr, Math.tan(erro / 2) * dist);
    const cor = eu.recarregaAte ? 'rgba(255,255,255,.4)' : '#eafff9';
    g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 3 * R.dpr;
    g.beginPath(); g.arc(mx, my, r, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = cor; g.lineWidth = 1.4 * R.dpr;
    g.beginPath(); g.arc(mx, my, r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = cor; g.fillRect(mx - 1.5 * R.dpr, my - 1.5 * R.dpr, 3 * R.dpr, 3 * R.dpr);
    /* marca de acerto: X branco, dourado na cabeça */
    const hit = J.marcas.filter(k => k.tipo === 'acerto' && k.de === eu.id && J.t - k.t < 0.18).pop();
    if (hit) {
      g.strokeStyle = hit.parte === 0 ? '#ffd166' : '#ffffff'; g.lineWidth = 2 * R.dpr;
      const k = 7 * R.dpr, k2 = 13 * R.dpr; g.beginPath();
      for (const [sx2, sy2] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { g.moveTo(mx + sx2 * k, my + sy2 * k); g.lineTo(mx + sx2 * k2, my + sy2 * k2); }
      g.stroke();
    }
  }
  /* minimapa */
  GP._minimapa(R, J);
};

/* Boneco com imagem (se o agente já tem): em pé, virado para o lado da mira
   (espelha para a esquerda), pés numa sombra com a cor do time e uma setinha
   mostrando para onde ele olha. */
GP._sprite = function (g, o, cor, t, quadro) {
  if (!o.agente) return false;
  const ent = GP.agenteImg(o.agente, quadro) || (quadro !== 'caido' ? GP.agenteImg(o.agente, 'parado') : null);
  if (!ent) return false;
  const img = GP.imagem(ent.src);
  if (!img) return false;
  const ref = GP.agenteImg(o.agente, 'parado') || ent;
  const k = GP.BONECO_ALTURA_M / ref.h;
  const esq = Math.cos(o.ang) < 0;
  const pesY = o.y + (quadro === 'caido' ? 0.25 : GP.BONECO_PES_M);
  /* sombra e anel do time nos pés */
  g.save();
  g.fillStyle = 'rgba(0,0,0,.38)'; g.beginPath(); g.ellipse(o.x, pesY, 0.62, 0.26, 0, 0, Math.PI * 2); g.fill();
  if (o.vivo) {
    g.strokeStyle = cor; g.lineWidth = 0.09; g.globalAlpha = 0.9;
    g.beginPath(); g.ellipse(o.x, pesY, 0.56, 0.22, 0, 0, Math.PI * 2); g.stroke();
    const ax = o.x + Math.cos(o.ang) * 0.75, ay = pesY + Math.sin(o.ang) * 0.32;
    g.fillStyle = cor; g.beginPath();
    g.moveTo(ax + Math.cos(o.ang) * 0.22, ay + Math.sin(o.ang) * 0.1);
    g.lineTo(ax + Math.cos(o.ang + 2.3) * 0.16, ay + Math.sin(o.ang + 2.3) * 0.08);
    g.lineTo(ax + Math.cos(o.ang - 2.3) * 0.16, ay + Math.sin(o.ang - 2.3) * 0.08);
    g.closePath(); g.fill();
  }
  g.restore();
  g.save(); g.translate(o.x, pesY);
  if (esq) g.scale(-1, 1);
  if (quadro === 'caido') g.drawImage(img, -ent.cx * k, -ent.py * k, ent.w * k, ent.h * k);
  else g.drawImage(img, -ent.px * k, -ent.py * k, ent.w * k, ent.h * k);
  g.restore();
  return true;
};
GP._agente = function (g, o, cor, alfa, t) {
  if (GP._sprite(g, o, cor, t, GP.quadroDoAgente(o, t))) { GP._vidaInimigo(g, o); return; }
  /* sem imagem: o boneco simples, um pouco maior que o corpo de verdade */
  g.save(); g.translate(o.x, o.y); g.rotate(o.ang); g.scale(1.35, 1.35);
  g.globalAlpha = alfa;
  /* sombra, ombros, cabeça e arma */
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0.08, 0.1, o.raio * 1.05, o.raio * 1.05, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = cor; g.beginPath(); g.ellipse(0, 0, o.raio * 0.78, o.raio, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0d141b'; g.fillRect(o.raio * 0.2, 0.06, o.raio * 1.55, 0.13);
  g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(0.02, 0, o.raio * 0.42, 0, Math.PI * 2); g.fill();
  g.fillStyle = cor; g.beginPath(); g.arc(0.02, 0, o.raio * 0.3, 0, Math.PI * 2); g.fill();
  g.restore();
  GP._vidaInimigo(g, o);
};
/* barra de vida curta para o inimigo */
GP._vidaInimigo = function (g, o) {
  if (o.time === 'eu' || o.hp >= 100) return;
  const y = o.agente && GP.agenteImg(o.agente, 'parado') ? o.y + GP.BONECO_PES_M - GP.BONECO_ALTURA_M - 0.25 : o.y - 0.95;
  g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(o.x - 0.5, y, 1, 0.12);
  g.fillStyle = '#ff4655'; g.fillRect(o.x - 0.5, y, o.hp / 100, 0.12);
};
GP._corpo = function (g, o, t) {
  if (GP._sprite(g, o, o.time === 'eu' ? '#18e5b4' : '#ff4655', t, 'caido')) return;
  g.save(); g.globalAlpha = 0.55; g.strokeStyle = o.time === 'eu' ? '#18e5b4' : '#ff4655'; g.lineWidth = 0.1;
  g.beginPath(); g.moveTo(o.x - 0.3, o.y - 0.3); g.lineTo(o.x + 0.3, o.y + 0.3); g.moveTo(o.x + 0.3, o.y - 0.3); g.lineTo(o.x - 0.3, o.y + 0.3); g.stroke();
  g.restore();
};
GP._minimapa = function (R, J) {
  const g = R.g, m = J.m, lado = 170 * R.dpr, k = lado / Math.max(m.larguraM, m.alturaM);
  const x0 = R.cv.width - lado - 14 * R.dpr, y0 = R.cv.height - lado * (m.alturaM / Math.max(m.larguraM, m.alturaM)) - 126 * R.dpr;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 0.85; g.imageSmoothingEnabled = false;
  g.drawImage(R.arte.mini, x0, y0, m.larguraM * k, m.alturaM * k);
  g.imageSmoothingEnabled = true; g.globalAlpha = 1;
  g.strokeStyle = 'rgba(255,255,255,.15)'; g.strokeRect(x0 - 0.5, y0 - 0.5, m.larguraM * k + 1, m.alturaM * k + 1);
  for (const o of J.ents) {
    if (!o.vivo || (o !== J.eu && !o._visivel)) continue;
    g.fillStyle = o === J.eu ? '#18e5b4' : '#ff4655';
    g.beginPath(); g.arc(x0 + o.x * k, y0 + o.y * k, 3.2 * R.dpr, 0, Math.PI * 2); g.fill();
    if (o === J.eu) { g.strokeStyle = '#18e5b4'; g.lineWidth = 1.5 * R.dpr; g.beginPath(); g.moveTo(x0 + o.x * k, y0 + o.y * k);
      g.lineTo(x0 + (o.x + Math.cos(o.ang) * 9) * k, y0 + (o.y + Math.sin(o.ang) * 9) * k); g.stroke(); }
  }
  g.restore();
};

var GP = (typeof GP !== 'undefined' && GP) || {};

GP.UI = {

  atribEu: null,
};

  if (!GP.NIVEIS[GP.UI.opc.nivelBot]) GP.UI.opc.nivelBot = 'tier2';

  if (!GP.UI.atribEu) GP.UI.atribEu = {...GP.NIVEIS[GP.UI.opc.nivelEu in GP.NIVEIS ? GP.UI.opc.nivelEu : 'tier2'].a};
};
const $gp = s => document.querySelector(s);

/* ---------- agentes no menu ---------- */
GP._rostoAgente = function (id, cls) {

};
GP._gradeAgentes = function (sel) {

      ${GP._rostoAgente(a.id, 'gp-ag-r')}<b>${escGP(a.nome)}</b></button>`).join('')}</div></div>`).join('');
};
/* o rival: o escolhido, ou um duelista sorteado (de preferência um que já tem boneco) */
GP._agenteDoRival = function () {
  const o = GP.UI.opc;

  const comImg = duel.filter(a => GP.temImagem('agentes', a.id, 'parado'));

    <div class="gp-cols">
      <div class="gp-sec"><div class="gp-eyebrow">Modo</div><div class="gp-ops">

        <div class="gp-eyebrow" style="margin-top:14px">Arma</div><div class="gp-ops gp-ops3">${armas}</div>
        <div class="gp-eyebrow" style="margin-top:14px">Rival</div><div class="gp-ops gp-ops3">
        ${Object.keys(GP.NIVEIS).map(k => bt('nivelBot', k, GP.NIVEIS[k].nome, GP.NIVEIS[k].desc)).join('')}</div>

        <div class="gp-eyebrow" style="margin-top:14px">Vence quem fizer</div><div class="gp-ops gp-ops3">
        ${bt('rounds', 3, '3 rounds')}${bt('rounds', 5, '5 rounds')}${bt('rounds', 7, '7 rounds')}</div>` : ''}
      </div>
      <div class="gp-sec"><div class="gp-eyebrow">O seu agente</div>${GP._gradeAgentes(o.agenteEu)}
        <p class="gp-dim gp-nota">Com contorno verde: já tem boneco. As habilidades entram na próxima fase; por enquanto o agente muda só o visual.</p>
        <label class="gp-rival">Agente do rival <select id="gpAgBot"><option value="aleatorio">um duelista sorteado</option>
          ${Object.values(GP.AGENTES).map(a => `<option value="${a.id}" ${o.agenteBot === a.id ? 'selected' : ''}>${escGP(a.nome)} · ${GP.PAPEIS[a.papel]}</option>`).join('')}</select></label>
        <div class="gp-eyebrow" style="margin-top:16px">O seu jogador</div><div class="gp-ops gp-ops3">
        ${Object.keys(GP.NIVEIS).map(k => bt('nivelEu', k, GP.NIVEIS[k].nome, 'atributos de ' + GP.NIVEIS[k].nome)).join('')}</div>
        <div class="gp-sls">${sliders}</div>
        <div class="gp-teclas"><div class="gp-eyebrow">Controles</div>
          <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover · <kbd>Shift</kbd> andar (sem barulho, mais preciso) · <kbd>Ctrl</kbd> agachar</p>
          <p><kbd>mouse</kbd> mirar · <kbd>clique</kbd> atirar · <kbd>botão direito</kbd> luneta (Operator) · <kbd>R</kbd> recarregar · <kbd>1</kbd><kbd>2</kbd> trocar arma · <kbd>roda</kbd> zoom · <kbd>Esc</kbd> pausa</p>
          <p class="gp-dim">Correndo, o tiro abre. Pare (solte as teclas ou segure Shift) antes de atirar e dê rajadas curtas. Os círculos vermelhos são passos que você ouve. A parede esconde: o resto do mapa você vê inteiro.</p></div>

  $gp('#gpMenu').hidden = false;
  document.querySelectorAll('#gpMenu [data-op]').forEach(el => el.onclick = () => {
    const g = el.dataset.op, v = el.dataset.val;
    o[g] = g === 'rounds' ? +v : v;
    if (g === 'nivelEu') GP.UI.atribEu = {...GP.NIVEIS[v].a};
    GP._salvarOpc(); GP.menu();
  });
  document.querySelectorAll('#gpMenu [data-atr]').forEach(el => el.oninput = () => {
    a[el.dataset.atr] = +el.value; el.nextElementSibling.textContent = el.value; o.nivelEu = 'personalizado';
    document.querySelectorAll('#gpMenu [data-op="nivelEu"]').forEach(b => b.classList.remove('on'));
    GP._salvarOpc();
  });
  $gp('#gpAgBot').onchange = e => { o.agenteBot = e.target.value; GP._salvarOpc(); };
  $gp('#gpJogar').onclick = GP.comecar;
};

/* ---------- partida ---------- */
GP.S = null;   /* a sessão em andamento */

/* carrega as imagens do mapa escolhido (texturas e objetos) antes de montar a arte */
GP._carregarImagensDoMapa = function (mapa) {
  const man = GP.manifesto(), srcs = [];
  for (const k of [mapa + '_piso', mapa + '_parede']) if ((man.texturas || {})[k]) srcs.push(man.texturas[k].src);
  for (const k in (man.objetos || {})) srcs.push(man.objetos[k].src);
  const esperas = srcs.map(src => new Promise(ok => {
    const im = GP.imagem(src) || GP.IMG.cache[src];
    if (!im || (im.complete && im.naturalWidth)) return ok();
    im.addEventListener('load', ok, {once: true}); im.addEventListener('error', ok, {once: true});
  }));
  return Promise.race([Promise.all(esperas), new Promise(ok => setTimeout(ok, 4000))]);
};
GP.comecar = async function () {
  const o = GP.UI.opc;
  await GP._carregarImagensDoMapa(o.mapa);
  for (const id of Object.keys(GP.AGENTES)) GP.precarregarAgente(id);
  for (const id of GP.ORDEM_ARMAS) if (GP.temImagem('armas', id)) GP.imagem(GP.manifesto().armas[id].src);
  const J = GP.montarDuelo({
    mapa: o.mapa, modo: o.modo, arma: o.arma, armaBot: o.arma === 'operator' ? 'vandal' : o.arma,
    atribEu: GP.UI.atribEu, atribBot: GP.NIVEIS[o.nivelBot].a, spawns: o.spawns, rounds: o.rounds,
    semente: (Date.now() & 0xffffff) || 1, agenteEu: o.agenteEu, agentesBot: [GP._agenteDoRival()],
    nome: GP.AGENTES[o.agenteEu].nome, nomesBot: ['Rival', 'Alvo 2', 'Alvo 3', 'Alvo 4'],
    agressivo: 0.5,
  });
  const cv = $gp('#gpTela');
  const R = {cv, g: cv.getContext('2d'), fog: document.createElement('canvas'), dpr: Math.min(2, window.devicePixelRatio || 1), arte: GP.desenharMapa(J.m)};
  R.fg = R.fog.getContext('2d');
  for (const b of J.ents) if (b.bot && b.agente && J.modo === 'duelo') b.nome = GP.AGENTES[b.agente].nome;
  GP.S = {J, R, cam: {x: J.eu.x, y: J.eu.y, escala: 1}, ui: {mouse: null, teclas: {}, poligono: [[0, 0]], botao: false, direito: false},
    ult: performance.now(), acum: 0, pausa: false, hudEm: 0, eventosVistos: 0, feed: []};
  GP._ajustarTela();
  $gp('#gpMenu').hidden = true; $gp('#gpFim').hidden = true; $gp('#gpPausa').hidden = true;
  $gp('#gpHud').hidden = false;
  document.body.classList.add('gp-jogando');
  requestAnimationFrame(GP._quadro);
};

GP._ajustarTela = function () {
  const S = GP.S; if (!S) return;
  const R = S.R, w = window.innerWidth, h = window.innerHeight;
  R.cv.width = Math.round(w * R.dpr); R.cv.height = Math.round(h * R.dpr);
  R.cv.style.width = w + 'px'; R.cv.style.height = h + 'px';
  R.fog.width = R.cv.width; R.fog.height = R.cv.height;
  /* a tela mostra ~68 m na largura (menos em tela estreita); a roda do mouse
     aproxima ou afasta (fica guardado) */
  S.metrosLargura = Math.max(36, Math.min(76, 56 * Math.sqrt(w / 1400))) * (GP.UI.opc.zoom || 1);
};

GP._comando = function () {
  const S = GP.S, J = S.J, eu = J.eu, k = S.ui.teclas, c = eu.cmd;
  c.mx = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0);
  c.my = (k.KeyS ? 1 : 0) - (k.KeyW ? 1 : 0);
  c.modo = k.ControlLeft || k.ControlRight ? 'agacha' : k.ShiftLeft || k.ShiftRight ? 'anda' : 'corre';
  c.luneta = S.ui.direito;
  if (S.ui.mouse) {
    const R = S.R, esc = S.cam.escala;
    const wx = S.cam.x + (S.ui.mouse.x * R.dpr - R.cv.width / 2) / esc;
    const wy = S.cam.y + (S.ui.mouse.y * R.dpr - R.cv.height / 2) / esc;
    c.ang = Math.atan2(wy - eu.y, wx - eu.x);
  }
  /* clique rápido (aperta e solta no mesmo quadro) ainda vale um tiro;
     arma automática atira enquanto o botão estiver apertado */
  const auto = GP.defArma(eu).auto;
  if (J.round.fase !== 'ativo') c.atirar = false;
  else if (S.ui.cliqueNovo) c.atirar = true;
  else if (auto) c.atirar = S.ui.botao;
  S.ui.cliqueNovo = false;
  if (J.round.fase !== 'ativo') { c.mx = c.my = 0; }
};

GP._quadro = function (agora) {
  const S = GP.S; if (!S) return;
  const J = S.J;
  let dt = Math.min(0.1, (agora - S.ult) / 1000); S.ult = agora;
  if (!S.pausa && !J.fim) {
    S.acum += dt;
    const h = 1 / 120;
    while (S.acum >= h) { GP._comando(); GP.passo(J, h); S.acum -= h; }
    GP.atualizarVisaoDoJogador(J);
  }
  /* câmera: segue você e puxa um pouco para onde você mira */
  const R = S.R, eu = J.eu;
  S.cam.escala = R.cv.width / (S.metrosLargura * (eu.luneta ? 1.35 : 1));
  let ox = 0, oy = 0;
  if (S.ui.mouse) {
    const fx = (S.ui.mouse.x * R.dpr - R.cv.width / 2) / S.cam.escala, fy = (S.ui.mouse.y * R.dpr - R.cv.height / 2) / S.cam.escala;
    const k = eu.luneta ? 0.55 : 0.32;
    ox = fx * k; oy = fy * k;
  }
  const tx = eu.x + ox, ty = eu.y + oy;
  S.cam.x += (tx - S.cam.x) * Math.min(1, dt * 10); S.cam.y += (ty - S.cam.y) * Math.min(1, dt * 10);
  GP.render(R, J, S.cam, S.ui);
  GP._lerEventos();
  if (agora - S.hudEm > 66) { S.hudEm = agora; GP._hud(); }
  if (J.fim && !S.fimMostrado) { S.fimMostrado = true; setTimeout(GP._fim, 900); }
  requestAnimationFrame(GP._quadro);
};

GP._lerEventos = function () {
  const S = GP.S, J = S.J;
  for (; S.eventosVistos < J.eventos.length; S.eventosVistos++) {
    const ev = J.eventos[S.eventosVistos];
    if (ev.tipo === 'morte') {
      const de = J.ents.find(o => o.id === ev.de), em = J.ents.find(o => o.id === ev.em);
      S.feed.unshift({t: performance.now(), de: de.nome, em: em.nome, arma: ev.arma, cabeca: ev.cabeca, meu: de === J.eu, morri: em === J.eu});
      S.feed = S.feed.slice(0, 5);
    }
  }
};

GP._hud = function () {
  const S = GP.S, J = S.J, eu = J.eu, R = J.round;
  const arm = GP.armaDe(eu), A = GP.defArma(eu);
  const resta = R.fase === 'ativo' ? Math.max(0, R.ate - J.t) : R.fase === 'pre' ? Math.max(0, R.ate - J.t) : 0;
  const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const alvos = J.modo === 'alvos';
  $gp('#gpPlacar').innerHTML = alvos
    ? `<span class="gp-pl-eu num">${eu.st.kills}</span><span class="gp-pl-meio"><b class="num">${mmss(resta)}</b><i>treino de alvos</i></span><span class="gp-pl-ele num">${eu.st.tiros ? Math.round(eu.st.cabecas / Math.max(1, eu.st.acertos) * 100) : 0}%<i>HS</i></span>`
    : `<span class="gp-pl-eu num">${J.placar.eu}</span><span class="gp-pl-meio"><b class="num">${R.fase === 'pre' ? 'em ' + Math.ceil(resta) : mmss(resta)}</b><i>round ${R.n} · primeiro a ${J.alvoRounds}</i></span><span class="gp-pl-ele num">${J.placar.eles}</span>`;
  $gp('#gpVida').innerHTML = `${eu.agente ? GP._rostoAgente(eu.agente, 'gp-hud-r') : ''}<div class="gp-hp"><b class="num">${Math.ceil(eu.hp)}</b><span>vida</span></div>
    <div class="gp-esc"><b class="num">${Math.ceil(eu.escudo)}</b><span>escudo</span></div>
    <div class="gp-modo">${eu.modo === 'corre' ? 'correndo' : eu.modo === 'anda' ? 'andando' : 'agachado'}${Math.hypot(eu.vx, eu.vy) > 3 ? ' · <em>tiro aberto</em>' : ''}</div>`;
  const silh = GP.temImagem('armas', arm.id) ? `<img class="gp-arma-img" src="${GP.manifesto().armas[arm.id].src}" alt="">` : '';
  $gp('#gpArma').innerHTML = `${silh}<div class="gp-arma-n">${A.nome}${eu.luneta ? ' · luneta' : ''}</div>
    <div class="gp-mun"><b class="num">${arm.municao}</b><span class="num">/ ${arm.reserva}</span></div>
    <div class="gp-dim">${eu.recarregaAte ? 'recarregando…' : J.t < eu.equipaAte ? 'sacando…' : '1 primária · 2 pistola'}</div>`;
  if (eu.agente && S.habDe !== eu.agente) {
    S.habDe = eu.agente;
    $gp('#gpHab').innerHTML = ['c', 'q', 'e', 'x'].map(k => {
      const ic = GP.agenteImg(eu.agente, k);
      return `<div class="gp-hab">${ic ? `<img src="${ic.src}" alt="">` : '<i></i>'}<kbd>${k.toUpperCase()}</kbd></div>`;
    }).join('') + '<span class="gp-hab-nota">habilidades na próxima fase</span>';
  }
  $gp('#gpArea').textContent = [GP.NOME_MAPA[J.m.nome], GP.areaEm(J.m, eu.x, eu.y), GP.sitioEm(J.m, eu.x, eu.y) ? 'bomb ' + GP.sitioEm(J.m, eu.x, eu.y).toUpperCase() : ''].filter(Boolean).join(' · ');
  const agora = performance.now();
  $gp('#gpFeed').innerHTML = S.feed.filter(f => agora - f.t < 6000).map(f => `<div class="gp-kf ${f.meu ? 'meu' : ''} ${f.morri ? 'morri' : ''}">
    <b>${escGP(f.de)}</b><span>${escGP(f.arma)}${f.cabeca ? ' ✦' : ''}</span><b>${escGP(f.em)}</b></div>`).join('');
  let faixa = '';
  if (R.fase === 'pre') faixa = alvos ? 'Prepare-se' : R.n === 1 ? 'Duelo — ' + GP.NOME_MAPA[J.m.nome] : 'Round ' + R.n;
  else if (R.fase === 'fim' && R.vencedor) faixa = R.vencedor === 'eu' ? 'Round seu' : R.vencedor === 'eles' ? 'Round perdido' : 'Tempo esgotado';
  const fx = $gp('#gpFaixa');
  fx.textContent = faixa; fx.className = 'gp-faixa' + (faixa ? ' on' : '') + (R.vencedor === 'eu' ? ' ok' : R.vencedor === 'eles' ? ' no' : '');
};

/* ---------- fim: números e o que treinar ---------- */
GP._fim = function () {
  const S = GP.S; if (!S) return;
  const J = S.J, r = GP.resumo(J), alvos = J.modo === 'alvos';
  const dicas = [];
  if (r.tiros >= 8 && r.correndo >= 30) dicas.push(`<b>${r.correndo}%</b> dos seus tiros saíram correndo. Correndo o tiro abre muito: solte as teclas (ou segure Shift) um instante antes de atirar.`);
  if (r.tiros >= 10 && r.abertos >= 35) dicas.push(`<b>${r.abertos}%</b> dos tiros com a rajada já aberta. Atire em rajadas de 3–5 e solte; de longe, tiro a tiro.`);
  if (r.acertos >= 6 && r.hs < 20) dicas.push(`Só <b>${r.hs}%</b> na cabeça. Mire no centro do boneco e espere o círculo da mira fechar.`);
  if (r.reacaoMs && r.reacaoMs > 450) dicas.push(`Do inimigo aparecer ao seu primeiro tiro: <b>${r.reacaoMs} ms</b>. Ande com a mira já apontada para onde ele pode surgir.`);
  if (!dicas.length) dicas.push(r.precisao >= 30 ? 'Mira e disciplina boas. Tente o rival um nível acima.' : 'Jogue de novo com Shift nas esquinas: andar não faz barulho e deixa o tiro mais preciso.');
  const titulo = alvos ? `${r.kills} abates em 60 s` : (J.fim.venceu ? 'Vitória ' : 'Derrota ') + J.placar.eu + '–' + J.placar.eles;
  $gp('#gpFim').innerHTML = `<div class="gp-fim-in"><div class="gp-eyebrow">${alvos ? 'Treino de alvos' : 'Duelo'} · ${GP.NOME_MAPA[J.m.nome]} · ${GP.ARMAS[GP.UI.opc.arma].nome}</div>
    <h2 class="${alvos ? '' : J.fim.venceu ? 'ok' : 'no'}">${titulo}</h2>
    <div class="gp-nums">
      <div><b class="num">${r.kills}/${r.mortes}</b><span>abates / mortes</span></div>
      <div><b class="num">${r.precisao}%</b><span>precisão</span></div>
      <div><b class="num">${r.hs}%</b><span>na cabeça</span></div>
      <div><b class="num">${r.reacaoMs != null ? r.reacaoMs + ' ms' : '—'}</b><span>reação média</span></div>
      <div><b class="num">${r.dano}</b><span>dano</span></div>
    </div>
    <div class="gp-eyebrow">O que treinar</div><ul class="gp-dicas">${dicas.map(d => `<li>${d}</li>`).join('')}</ul>
    <div class="gp-acoes"><button class="gp-jogar" id="gpDeNovo">Jogar de novo</button><button class="gp-sec-bt" id="gpMenuBt">Mudar opções</button></div></div>`;
  $gp('#gpFim').hidden = false;
  $gp('#gpDeNovo').onclick = GP.comecar;
  $gp('#gpMenuBt').onclick = GP.sair;
};
GP.sair = function () {
  GP.S = null;
  document.body.classList.remove('gp-jogando');
  $gp('#gpHud').hidden = true; $gp('#gpFim').hidden = true; $gp('#gpPausa').hidden = true;
  const R = $gp('#gpTela').getContext('2d'); R.setTransform(1, 0, 0, 1, 0, 0); R.clearRect(0, 0, 99999, 99999);
  GP.menu();
};
GP.pausar = function (on) {
  const S = GP.S; if (!S || S.J.fim) return;
  S.pausa = on; S.ui.teclas = {}; S.ui.botao = false;
  $gp('#gpPausa').hidden = !on;
  if (on) $gp('#gpPausa').innerHTML = `<div class="gp-fim-in"><h2>Pausa</h2><div class="gp-acoes">
    <button class="gp-jogar" id="gpVoltar">Voltar ao jogo</button><button class="gp-sec-bt" id="gpDesistir">Sair da partida</button></div></div>`;
  if (on) { $gp('#gpVoltar').onclick = () => GP.pausar(false); $gp('#gpDesistir').onclick = GP.sair; }
};

/* ---------- entrada ---------- */
GP.ligar = function () {
  GP._lerOpc();
  const cv = $gp('#gpTela');
  window.addEventListener('resize', GP._ajustarTela);
  window.addEventListener('keydown', e => {
    if (!GP.S) return;
    if (e.code === 'Escape') { GP.pausar(!GP.S.pausa); e.preventDefault(); return; }
    if (GP.S.pausa) return;
    GP.S.ui.teclas[e.code] = true;
    const c = GP.S.J.eu.cmd;
    if (e.code === 'KeyR') c.recarregar = true;
    if (e.code === 'Digit1') c.trocar = 'primaria';
    if (e.code === 'Digit2') c.trocar = 'secundaria';
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ControlLeft', 'ShiftLeft', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { if (GP.S) GP.S.ui.teclas[e.code] = false; });
  window.addEventListener('blur', () => { if (GP.S && !GP.S.J.fim) GP.pausar(true); });
  cv.addEventListener('mousemove', e => { if (GP.S) GP.S.ui.mouse = {x: e.clientX, y: e.clientY}; });
  cv.addEventListener('mousedown', e => {
    if (!GP.S || GP.S.pausa) return;
    if (e.button === 0) { GP.S.ui.botao = true; GP.S.ui.cliqueNovo = true; }
    if (e.button === 2) GP.S.ui.direito = true;
  });
  window.addEventListener('mouseup', e => { if (!GP.S) return; if (e.button === 0) GP.S.ui.botao = false; if (e.button === 2) GP.S.ui.direito = false; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => {
    if (!GP.S) return;
    e.preventDefault();
    GP.UI.opc.zoom = Math.max(0.65, Math.min(1.5, (GP.UI.opc.zoom || 1) * (e.deltaY > 0 ? 1.08 : 1 / 1.08)));
    GP._salvarOpc(); GP._ajustarTela();
  }, {passive: false});
  /* no navegador, Ctrl+W fecha a aba: pergunta antes, no meio da partida */
  window.addEventListener('beforeunload', e => { if (GP.S && !GP.S.J.fim) { e.preventDefault(); e.returnValue = ''; } });
  GP.menu();
};
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', GP.ligar);

</script>
</body>
</html>

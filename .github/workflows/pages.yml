# Publica o jogo no GitHub Pages a cada push na main.
# O site é o dist/vct-manager.html (renomeado para index.html) com a pasta
# assets/ ao lado, que é exatamente o que o build espera.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Só o jsdom é necessário para o teste de interface; o playwright
      # (capturas de tela) fica de fora para a publicação ser rápida.
      - name: Instalar dependência do teste
        run: npm install --no-save --no-package-lock jsdom@^30.0.1

      - name: Verificar motor
        run: node tools/verificar.mjs 3

      - name: Build
        run: node tools/build.mjs

      - name: Testar interface
        run: node tools/testar-ui.mjs

      - name: Montar o site
        run: |
          mkdir -p _site
          cp dist/vct-manager.html _site/index.html
          cp -r assets _site/assets
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
